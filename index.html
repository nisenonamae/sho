  return '<div class="tform"><p style="font-size:.84rem;color:var(--sub);margin:.2rem 0 .5rem">続けやすいタスクにするための問いに答えてください。省と' + esc(p.label) + "は最初から結びつきます。</p>" +
    '<div class="f"><label>何をする?(タスクの名前)</label><input id="tf-name" placeholder="例:青チャート例題を3題"></div>' +
    '<div class="f"><label>最初の一歩は?(これだけはやる、という小さな行動)</label><input id="tf-step" placeholder="例:例題を1題だけ開く"></div>' +
    '<div class="grid2"><div class="f"><label>1回何分?</label><input id="tf-min" type="number" min="1" value="15"></div>' +
    '<div class="f"><label>いつ?</label><select id="tf-slot"><option>朝</option><option>昼</option><option>夜</option><option>一日中</option></select></div>' +
    '<div class="f"><label>どこで?</label><input id="tf-place" placeholder="机"></div>' +
    '<div class="f"><label>どのくらいの間隔?</label><input id="tf-interval" placeholder="空欄なら毎日(例:月水金)"></div></div>' +
    '<div class="row-btns"><button type="button" class="btn" data-task-add>行軍表に入れる</button><button type="button" class="btn ghost" data-task-cancel>やめる</button></div></div>';
}
async function sha1Hex(sx){ const b = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(sx)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }


function renderMinForm(){
  const box = document.getElementById("min-form"); if (!box) return;
  box.innerHTML = mins.form ? '<div class="cform" style="margin-bottom:.6rem"><input id="mf-name" placeholder="名前(例:経済省)"><input id="mf-tag" placeholder="所属タグ(例:経済)">' +
    '<input id="mf-deps" placeholder="依存先(例:受験:2, 家族:1)" style="flex:1"><button type="button" class="btn sm" id="mf-add">足す</button><button type="button" class="btn ghost sm" id="mf-cancel">やめる</button>' +
    '<span style="font-size:.76rem;color:var(--sub);flex-basis:100%">所属タグはタスクや国力の記録と結びつく短い名前で、あとから変えられません。国力には翌朝の計算から入ります。</span><span class="status" id="mf-msg"></span></div>' : "";
}
function bindMins(){
  document.getElementById("add-ministry").addEventListener("click", () => { mins.form = !mins.form; renderMinForm(); });
  document.getElementById("min-form").addEventListener("input", e => {
    if (e.target.id === "mf-name") { const t = document.getElementById("mf-tag"); if (!t.dataset.touched) t.value = e.target.value.replace(/省$/, ""); }
    if (e.target.id === "mf-tag") e.target.dataset.touched = "1";
  });
  document.getElementById("min-form").addEventListener("click", async e => {
    if (e.target.id === "mf-cancel") { mins.form = false; renderMinForm(); return; }
    if (e.target.id !== "mf-add") return;
    const name = document.getElementById("mf-name").value.trim(), tag = document.getElementById("mf-tag").value.trim(), deps = document.getElementById("mf-deps").value.trim();
    const msg = t => { document.getElementById("mf-msg").textContent = t; document.getElementById("mf-msg").classList.add("err"); };
    if (!name || !tag) return msg("名前と所属タグを入れてください。");
    if (((state.gov && state.gov.ministries) || []).some(m => m.tag === tag)) return msg("その所属タグの省はもうあります。");
    const ok = await saveMins(doc => { doc.ministries = (doc.ministries || []).concat([{ tag, name, deps, deadline: "", progress: 0, created: taskDay() }]); });
    if (ok) { mins.form = false; renderMinForm(); render(); }
  });
  document.getElementById("detail").addEventListener("click", async e => {
    let b;
    if ((b = e.target.closest("[data-min-edit]"))) { mins.edit = b.dataset.minEdit; renderDetail(); return; }
    if (e.target.closest("[data-min-cancel]")) { mins.edit = false; renderDetail(); return; }
    if ((b = e.target.closest("[data-min-save]"))) {
      const tag = b.dataset.minSave, name = document.getElementById("me-name").value.trim() || tag, deps = document.getElementById("me-deps").value.trim();
      const ok = await saveMins(doc => { let m = (doc.ministries || []).find(x => x.tag === tag);
        if (!m) { const g = state.gov.ministries.find(x => x.tag === tag) || {}; m = { tag, progress: g.progress || 0, deadline: g.deadline || "" }; doc.ministries = (doc.ministries || []).concat([m]); }
        m.name = name; m.deps = deps; });
      if (ok) { mins.edit = false; renderDetail(); }
    }
  });
}

function bindPages(){
  const box = document.getElementById("detail");
  box.addEventListener("click", e => {
    const t = e.target.closest("[data-mtab]"); if (!t) return;
    state.mtab = t.dataset.mtab; try { localStorage.setItem("sho-mtab", t.dataset.mtab); } catch (err) {}
    box.querySelectorAll("[data-mtab]").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    box.querySelectorAll(".mpane").forEach(p => { p.hidden = p.dataset.pane !== t.dataset.mtab; });
  });
  const msg = (t, err) => { const el = document.getElementById("pg-msg"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } };
  const rerender = () => renderDetail();
  box.addEventListener("click", async e => {
    const q = sx => e.target.closest(sx); let b;
    if ((b = q("[data-goto-page]"))) { e.preventDefault(); openPage(b.dataset.gotoPage); return; }
    if ((b = q("[data-page-new]"))) {
      const kind = b.dataset.pageNew, parent = b.dataset.pageParent;
      const tag = parent.startsWith("m:") ? parent.slice(2) : rootTag(pageById(parent));
      const id = "pg" + uid(), label = kind === "page" ? "" : nextLabel(kind, parent, tag);
      await savePages(doc => { doc.pages.push({ id, parent, kind, label, title: kind === "page" ? "新しいページ" : "", theme: "", content: "", clear: [], analysis: {}, status: kind === "page" ? "" : "未着手", body: "", tables: {}, created: taskDay(), updated: taskDay() }); });
      pg.edit = true; openPage(id); return;
    }
    // 引っ越し箱
    if ((b = q("[data-box-open]"))) { e.preventDefault(); const bp = pg.doc.pages.find(x => x.id === b.dataset.boxOpen); pg.box = bp.id; pg.boxTag = state.open; renderBox(box, bp); window.scrollTo && window.scrollTo(0, 0); return; }
    if (q("[data-box-back]")) { pg.box = null; renderDetail(); return; }
    if ((b = q("[data-box-clear]"))) {
      const tag = b.dataset.boxClear, ids = new Set(boxPages().filter(p => { let c = p, g = 0; while (c && g++ < 50) { if (String(c.parent).startsWith("m:")) return c.parent.slice(2) === tag; c = pg.doc.pages.find(y => y.id === c.parent); } return false; }).map(p => p.id));
      if (!confirm("引っ越し箱の " + ids.size + " 件を全部消しますか。")) return;
      await savePages(doc => { doc.pages.forEach(x => { if (ids.has(x.id)) x.deleted = taskDay(); }); }); renderDetail(); return;
    }
    if (pg.box && (b = q("[data-box-use]"))) {
      const src = pg.doc.pages.find(x => x.id === pg.box), kind = b.dataset.boxUse, sel = document.getElementById("box-parent").value;
      const tag = pg.boxTag, parent = sel === "root" ? "m:" + tag : sel;
      const id = "pg" + uid(), label = kind === "page" ? "" : nextLabel(kind, parent, tag);
      const tmpl = kind === "page" ? (src.body || "") : "";
      const analysis = kind === "page" ? {} : analysisFromBody(src.body || "");
      const tbls = JSON.parse(JSON.stringify(src.tables || {}));
      const tref = kind === "page" ? "" : Object.keys(tbls).map(t => "{{表:" + t + "}}").join("\n");
      await savePages(doc => {
        doc.pages.push({ id, parent, kind, label, title: kind === "page" ? (src.title || "資料") : "", theme: src.theme || "", content: src.content || "",
          clear: (src.clear || []).map(c => Object.assign({}, c, { id: uid() })), analysis, status: kind === "page" ? "" : "未着手", body: (tmpl + (tref ? "\n" + tref : "")).trim(), tables: tbls, created: taskDay(), updated: taskDay(), from: src.notion || "" });
        doc.pages.find(x => x.id === src.id).deleted = taskDay();
      });
      pg.box = null; openPage(id); pg.edit = true; renderDetail(); return;
    }
    if (pg.box && q("[data-box-del]")) { const id = pg.box; await savePages(doc => { doc.pages.find(x => x.id === id).deleted = taskDay(); }); pg.box = null; renderDetail(); return; }
    const p = pg.open && pageById(pg.open);
    if (p && (b = q("[data-page-status]"))) { const v = b.dataset.pageStatus; await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); x.status = v; if (v === "クリア") x.clearedAt = taskDay(); }); renderDetail(); return; }
    if (q("[data-page-back]")) { pg.open = null; pg.edit = false; history.replaceState && history.replaceState(null, "", location.pathname); rerender(); return; }
    if (!p) return;
    if (q("[data-page-edit]")) { pg.edit = true; rerender(); return; }
    if ((b = q("[data-an-edit]"))) { pg.edit = true; rerender(); const ta = document.getElementById("pg-a-" + b.dataset.anEdit); if (ta) { ta.focus(); ta.scrollIntoView && ta.scrollIntoView({ block: "center" }); } return; }
    if (q("[data-page-cancel]")) { pg.edit = false; rerender(); return; }
    if (q("[data-page-save]")) {
      const v = id => (document.getElementById(id) || {}).value;
      await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); x.title = (v("pg-title") || "").trim(); x.body = v("pg-body") || "";
        if (x.kind !== "page") { x.theme = v("pg-theme") || ""; x.content = v("pg-content") || ""; x.status = v("pg-status") || x.status;
          x.analysis = {}; ANALYSIS.forEach(([k]) => { const t = (v("pg-a-" + k) || "").trim(); if (t) x.analysis[k] = t; }); } x.updated = taskDay(); });
      pg.edit = false; rerender(); return;
    }
    if (q("[data-page-addtable]") || q("[data-page-addapp]")) {
      const ta = document.getElementById("pg-body");
      if (q("[data-page-addtable]")) { const tid = "t" + uid().slice(-6);
        p.tables = Object.assign({}, p.tables || {}, { [tid]: { cols: [{ name: "名前", type: "text" }, { name: "メモ", type: "text" }], rows: [["", ""]] } });
        ta.value = ta.value.replace(/\s*$/, "") + "\n{{表:" + tid + "}}\n"; pg.tableEdit = p.id + ":" + tid; }
      else { const url = prompt("置くアプリのURL(例:https://nisenonamae.github.io/…)"); if (!url) return; ta.value = ta.value.replace(/\s*$/, "") + "\n{{アプリ:" + url.trim() + "}}\n"; }
      return;
    }
    if (q("[data-page-del]")) {
      if (childrenOf(p.id).length) { msg("この下にページがあるので消せません。先に下のページを消すか移してください。", true); return; }
      if (!confirm("「" + (p.label || p.title) + "」を消しますか。")) return;
      await savePages(doc => { doc.pages.find(y => y.id === p.id).deleted = taskDay(); });
      const parent = p.parent; pg.open = String(parent).startsWith("m:") ? null : parent; rerender(); return;
    }
    if (q("[data-page-clear]")) { await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); x.status = "クリア"; x.clearedAt = taskDay(); }); rerender(); return; }
    // クリア条件
    if (q("[data-cond-new]")) { pg.condForm = true; rerender(); return; }
    if (q("[data-cond-cancel]")) { pg.condForm = false; rerender(); return; }
    if (q("[data-cond-add]")) {
      const type = document.getElementById("cf-type").value;
      const c = type === "manual" ? { id: uid(), type, text: (document.getElementById("cf-text").value || "").trim(), done: false }
        : { id: uid(), type, task: document.getElementById("cf-task").value, metric: document.getElementById("cf-metric").value, value: (document.getElementById("cf-value").value || "").trim() };
      if (type === "manual" ? !c.text : (!c.task || !c.value || (c.metric !== "status" && isNaN(+c.value)) || (c.metric === "status" && !(c.value in RANK_ST)))) { msg("条件の中身を入れてください(状況なら 新規・進行中・定着・熟達・殿堂入り、数なら数字)。", true); return; }
      await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); x.clear = (x.clear || []).concat([c]); }); pg.condForm = false; rerender(); return;
    }
    if ((b = q("[data-cond-del]"))) { const id = b.dataset.condDel; await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); x.clear = x.clear.filter(c => c.id !== id); }); rerender(); return; }
    // タスクを作る
    if (q("[data-task-new]")) { pg.taskForm = true; rerender(); return; }
    if (q("[data-task-cancel]")) { pg.taskForm = false; rerender(); return; }
    if (q("[data-task-add]")) {
      const v = id => (document.getElementById(id).value || "").trim();
      const name = v("tf-name"); if (!name) { msg("タスクの名前を入れてください。", true); return; }
      if (state.tasks.some(t => t.def.name === name)) { msg("同じ名前のタスクがもうあります。", true); return; }
      const tag = rootTag(p), day = taskDay(), id = "t" + (await sha1Hex(name + "|" + day)).slice(0, 10);
      const def = { id, name, aliases: [], ministries: [tag], waves: [{ label: p.label, url: pageUrl(p.id) }], slot: v("tf-slot") || "一日中", stance: "攻", kind: "習慣型",
        interval: v("tf-interval"), weight: null, quota: null, requirement: v("tf-step") ? "最初の一歩:" + v("tf-step") : "", created: day, initial: { status: "新規" },
        generations: [{ gen: 1, from: day, target: 10 }], events: [] };
      for (let i = 0; i < 3; i++) {
        const r = await readJson("roadmap/tasks/overlay.json"), ov = r.data || { version: 1, tasks: {}, newTasks: [] };
        ov.newTasks = (ov.newTasks || []).concat([def]);
        try { await writeJson("roadmap/tasks/overlay.json", ov, r.sha); state.overlay = ov; break; } catch (err) { if (err.status !== 409 && err.status !== 422) { msg(err.message, true); return; } }
      }
      // 行軍表の組み立てに使う設定(所要時間・場所)も入れておく
      for (let i = 0; i < 3; i++) {
        const r = await readJson("roadmap/settings.json"); if (!r.data) break;
        const st = r.data; st.tasks = st.tasks || {};
        st.tasks[name] = Object.assign({ min: Math.max(1, +v("tf-min") || 15), place: v("tf-place") || "どこでも", organs: ["目", "手"], mode: "", priority: 0, fixed: "", next: "" }, st.tasks[name] || {});
        try { await writeJson("roadmap/settings.json", st, r.sha); break; } catch (err) { if (err.status !== 409 && err.status !== 422) break; }
      }
      computeTasks(); pg.taskForm = false; rerender(); msg("「" + name + "」を行軍表に入れました。"); return;
    }
    // 表
    if ((b = q("[data-tedit]"))) { const k = p.id + ":" + b.dataset.tedit; pg.tableEdit = pg.tableEdit === k ? null : k; rerender(); return; }
    if ((b = q("[data-tsort]")) && !q("[data-tcol-del]")) { const [tid, ci] = b.dataset.tsort.split(":"); pg.tSort = pg.tSort || {}; const cur = pg.tSort[tid];
      pg.tSort[tid] = cur && cur.col === +ci ? (cur.dir > 0 ? { col: +ci, dir: -1 } : null) : { col: +ci, dir: 1 }; rerender(); return; }
    const tsave = async f => { await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); f(x); x.updated = taskDay(); }); rerender(); };
    if ((b = q("[data-trow-add]"))) { const tid = b.dataset.trowAdd; return tsave(x => { const t = x.tables[tid]; t.rows.push(t.cols.map(c => c.type === "check" ? false : "")); }); }
    if ((b = q("[data-trow-del]"))) { const [tid, ri] = b.dataset.trowDel.split(":"); return tsave(x => { x.tables[tid].rows.splice(+ri, 1); }); }
    if ((b = q("[data-tcol-del]"))) { const [tid, ci] = b.dataset.tcolDel.split(":"); if (!confirm("この列を消しますか。")) return; return tsave(x => { const t = x.tables[tid]; t.cols.splice(+ci, 1); t.rows.forEach(r => r.splice(+ci, 1)); }); }
    if ((b = q("[data-tcol-add]"))) { const tid = b.dataset.tcolAdd, nm = (box.querySelector('[data-tcol-name="' + tid + '"]').value || "").trim(); if (!nm) return;
      const ty = box.querySelector('[data-tcol-type="' + tid + '"]').value, op = (box.querySelector('[data-tcol-opts="' + tid + '"]').value || "").split(/[、,]/).map(x => x.trim()).filter(Boolean);
      return tsave(x => { const t = x.tables[tid]; t.cols.push(ty === "select" ? { name: nm, type: ty, options: op } : { name: nm, type: ty }); t.rows.forEach(r => r.push(ty === "check" ? false : "")); }); }
  });
  box.addEventListener("change", async e => {
    const p = pg.open && pageById(pg.open); if (!p) return;
    const c = e.target.closest("[data-cond-check]");
    if (c) { const id = c.dataset.condCheck, on = c.checked; await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); const k = x.clear.find(z => z.id === id); k.done = on; }); renderDetail(); return; }
    const pc = e.target.closest("[data-pcl]");
    if (pc) { const i = +pc.dataset.pcl, on = pc.checked; await savePages(doc => { const x = doc.pages.find(y => y.id === p.id); const ls = x.body.split("\n"); ls[i] = ls[i].replace(/- \[( |x)\]/, on ? "- [x]" : "- [ ]"); x.body = ls.join("\n"); }); return; }
    const tc = e.target.closest("[data-tcell]");
    if (tc) { const [tid, ri, ci] = tc.dataset.tcell.split(":"), t = p.tables[tid], ty = t.cols[+ci].type;
      const val = ty === "check" ? tc.checked : (ty === "num" ? (tc.value === "" ? "" : +tc.value) : tc.value);
      await savePages(doc => { doc.pages.find(y => y.id === p.id).tables[tid].rows[+ri][+ci] = val; }); return; }
  });
  box.addEventListener("input", e => {
    const f = e.target.closest("[data-tfilter]"); if (!f) return;
    pg.tFilter = pg.tFilter || {}; pg.tFilter[f.dataset.tfilter] = f.value;
    const pos = f.selectionStart; renderDetail();
    const nf = document.querySelector('[data-tfilter="' + f.dataset.tfilter + '"]'); if (nf) { nf.focus(); try { nf.setSelectionRange(pos, pos); } catch (err) {} }
  });
  window.addEventListener("hashchange", fromHash);
}
function openPage(id){
  const p = pageById(id); if (!p) return;
  pg.open = id; pg.condForm = false; pg.taskForm = false;
  state.open = rootTag(p); showView("list"); renderDetail();
  if (history.replaceState) history.replaceState(null, "", "#page=" + id);
  window.scrollTo && window.scrollTo(0, 0);
}
function fromHash(){ const m = /^#page=(.+)$/.exec(location.hash || ""); if (m && pageById(m[1])) openPage(m[1]); }

/* ───── 保存 ───── */
async function commitReview(month, mutate){
  const path = P.reviews + "/" + month + ".json";
  mutate();
  render();
  for (let i = 0; i < 3; i++) {
    try {
      state.reviewShas[month] = await writeJson(path, state.reviews[month] || {}, state.reviewShas[month] || null);
      lsSet(KEY_CACHE, { gov: state.gov, stats: state.stats, reviews: state.reviews, reviewShas: state.reviewShas });
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(path);
        state.reviews[month] = fresh.data || {}; state.reviewShas[month] = fresh.sha;
        mutate(); render(); continue;
      }
      const s = document.getElementById("rv-status"); if (s) { s.textContent = e.message || "保存できませんでした"; s.classList.add("err"); }
      return false;
    }
  }
  return false;
}
function entryFor(month, key, tag, kind, start){
  const mo = state.reviews[month] = state.reviews[month] || {};
  return mo[key] = mo[key] || { tag, period: kind, start, c: "", orders: [] };
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

async function saveNotes(mutate){
  const st = document.getElementById("pp-status");
  for (let i = 0; i < 3; i++) {
    try {
      mutate(state.notes);
      state.notesSha = await writeJson(NOTES, state.notes, state.notesSha);
      lsSet(KEY_CACHE, { gov: state.gov, stats: state.stats, reviews: state.reviews, reviewShas: state.reviewShas, notes: state.notes });
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(NOTES);
        state.notes = (fresh.data && fresh.data.purposes) ? fresh.data : { purposes: {} }; state.notesSha = fresh.sha; continue;
      }
      if (st) { st.textContent = e.message || "保存できませんでした"; st.classList.add("err"); }
      return false;
    }
  }
  return false;
}
async function savePurpose(tag, text){
  const st = document.getElementById("pp-status");
  for (let i = 0; i < 3; i++) {
    try {
      state.notes.purposes = Object.assign({}, state.notes.purposes, { [tag]: text });
      state.notesSha = await writeJson(NOTES, state.notes, state.notesSha);
      lsSet(KEY_CACHE, { gov: state.gov, stats: state.stats, reviews: state.reviews, reviewShas: state.reviewShas, notes: state.notes });
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(NOTES);
        state.notes = (fresh.data && fresh.data.purposes) ? fresh.data : { purposes: {} }; state.notesSha = fresh.sha; continue;
      }
      if (st) { st.textContent = e.message || "保存できませんでした"; st.classList.add("err"); }
      return false;
    }
  }
  return false;
}

// Notionと同期:GitHubに書き出しだけを今すぐ走らせ、終わったら読み直す
async function syncNow(){
  const st = document.getElementById("sync-status");
  const say = (t, err) => { st.textContent = t; st.classList.toggle("err", !!err); };
  if (!state.conn || !state.conn.token) { say("先に設定で接続してください。", true); return; }
  const before = (await readJson(P.gov).catch(() => ({}))).sha || null;
  say("Notionから書き出しています…(1分ほど)");
  const r = await fetchRetry(repoUrl() + "/actions/workflows/gov-export.yml/dispatches",
    { method: "POST", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify({ ref: state.conn.branch || "main" }) }).catch(() => null);
  if (!r || r.status !== 204) {
    if (r && (r.status === 403 || r.status === 401)) say("トークンに Actions の権限(Read and write)が必要です。", true);
    else if (r && r.status === 404) say("gov-export.yml が notion-daily の .github/workflows に見つかりません。", true);
    else say("書き出しを始められませんでした。", true);
    return;
  }
  for (let i = 0; i < 30; i++) {
    await new Promise(res => setTimeout(res, window.__shoPoll || 8000));
    const now = (await readJson(P.gov).catch(() => ({}))).sha || null;
    if (now && now !== before) { await loadAll(); say("同期しました"); return; }
  }
  say("まだ書き出しが終わっていません。少し待ってから「読み込み直す」を押してください。", true);
}

/* ───── 操作 ───── */
function showView(name){
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + name);
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === name)));
  window.scrollTo(0, 0);
}
function bind(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.view;
    if (v === "list") { state.open = null; render(); }
    if (v === "orders") renderOrders();
    if (v === "gov") renderGov();
    showView(v);
  }));
  document.getElementById("list").addEventListener("click", e => {
    const b = e.target.closest("[data-open]"); if (!b) return;
    // 一覧から省を押したら、開いていたページは閉じて、その省の地図を出す
    pg.open = null; pg.box = null; pg.edit = false;
    if (history.replaceState && /^#page=/.test(location.hash)) history.replaceState(null, "", location.pathname);
    state.open = b.dataset.open; render(); window.scrollTo(0, 0);
  });
  const onCheck = async e => {
    const c = e.target.closest("[data-check]"); if (!c) return;
    const { month, key } = c.dataset, id = c.dataset.check, on = c.checked;
    await commitReview(month, () => {
      const en = (state.reviews[month] || {})[key]; if (!en) return;
      const o = (en.orders || []).find(x => x.id === id); if (!o) return;
      o.done = on; o.doneAt = on ? taskDay() : null; en.updatedAt = new Date().toISOString();
    });
  };
  document.getElementById("detail").addEventListener("change", onCheck);
  document.getElementById("orders").addEventListener("change", async e => {
    const c = e.target.closest("[data-cc-check]");
    if (!c) return onCheck(e);
    await saveGov("council", () => { const it = gov.council.standing.find(x => x.id === c.dataset.ccIt); const o = it && it.orders.find(x => x.id === c.dataset.ccCheck); if (o) { o.done = true; o.doneAt = taskDay(); } });
    renderOrders();
  });
  bindGov();
  bindStaff();
  bindPages();
  bindMins();
  document.getElementById("sync").addEventListener("click", syncNow);
  document.getElementById("detail").addEventListener("click", async e => {
    if (e.target.closest("[data-back]")) { state.open = null; state.editPurpose = false; pg.open = null; pg.edit = false; render(); return; }
    if (e.target.closest("[data-sl-edit]")) { state.editSlogan = "edit"; renderDetail(); return; }
    if (e.target.closest("[data-sl-new]")) { state.editSlogan = "new"; renderDetail(); return; }
    if (e.target.closest("[data-sl-cancel]")) { state.editSlogan = false; renderDetail(); return; }
    if (e.target.closest("[data-sl-save]")) {
      const v = id => document.getElementById(id).value.trim();
      const item = { title: v("sl-title") || "スローガン", text: v("sl-text"), note: v("sl-note"), from: taskDay() };
      if (!item.text) { const st = document.getElementById("pp-status"); st.textContent = "スローガンを入れてください。"; st.classList.add("err"); return; }
      const mode = state.editSlogan;
      const ok = await saveNotes(n => {
        const list = (n.slogans && n.slogans.length) ? n.slogans.slice() : DEFAULT_SLOGANS.map(x => Object.assign({}, x));
        if (mode === "new") list.push(item);
        else list[list.length - 1] = Object.assign({}, list[list.length - 1], { title: item.title, text: item.text, note: item.note });
        n.slogans = list;
      });
      if (ok) { state.editSlogan = false; render(); }
      return;
    }
    if (e.target.closest("[data-pp-edit]")) { state.editPurpose = true; renderDetail(); return; }
    if (e.target.closest("[data-pp-cancel]")) { state.editPurpose = false; renderDetail(); return; }
    if (e.target.closest("[data-pp-save]")) {
      const text = document.getElementById("pp-text").value;
      if (await savePurpose(state.open, text)) { state.editPurpose = false; renderDetail(); }
      return;
    }
    const pb = e.target.closest("[data-period]");
    if (pb) { state.period = pb.dataset.period; renderDetail(); document.getElementById("review").scrollIntoView({ block: "nearest" }); return; }
    const m = currentMinistry(); if (!m) return;
    const kind = state.period, start = periodStart(kind, taskDay()), month = start.slice(0, 7), key = rkey(m.tag, kind, start);
    if (e.target.closest("[data-add]")) {
      const inp = document.getElementById("rv-new"), text = inp.value.trim(); if (!text) return;
      const c = document.getElementById("rv-c").value;
      await commitReview(month, () => { const en = entryFor(month, key, m.tag, kind, start); en.c = c; en.orders = (en.orders || []).concat([{ id: uid(), text, done: false }]); en.updatedAt = new Date().toISOString(); });
      const s = document.getElementById("rv-new"); if (s) s.focus();
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) { const id = del.dataset.del; await commitReview(month, () => { const en = entryFor(month, key, m.tag, kind, start); en.orders = (en.orders || []).filter(o => o.id !== id); }); return; }
    if (e.target.closest("[data-save]")) {
      const c = document.getElementById("rv-c").value;
      const ok = await commitReview(month, () => { const en = entryFor(month, key, m.tag, kind, start); en.c = c; en.updatedAt = new Date().toISOString(); });
      const s = document.getElementById("rv-status"); if (s && ok) s.textContent = "保存しました";
      return;
    }
    if (e.target.closest("[data-older]")) {
      const months = Array.from(state.loadedMonths).sort();
      const older = addDays(months[0] + "-01", -1).slice(0, 7);
      try { await loadReviewMonth(older); renderDetail(); } catch (err) { const s = document.getElementById("rv-status"); if (s) s.textContent = err.message; }
    }
  });
  document.getElementById("connect").addEventListener("click", async () => {
    const v = id => document.getElementById(id).value.trim();
    state.conn = { owner: v("c-owner"), repo: v("c-repo"), branch: v("c-branch") || "main", token: v("c-token") };
    lsSet(KEY_CONN, state.conn);
    if (await loadAll()) showView("list");
  });
  document.getElementById("reload").addEventListener("click", loadAll);
}
function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  bind();
  document.getElementById("notion-places").innerHTML =
    '<p style="font-size:.84rem;margin:.2rem 0">省・STAGE・WAVE・ページは、このアプリで足したり直したりします。</p>' +
    '<p style="font-size:.84rem;margin:.4rem 0 .2rem">次のものはNotionにあり、<b>Claudeに頼んで</b>直します:</p>' +
    '<ul style="font-size:.84rem;margin:.2rem 0;padding-left:1.2rem"><li>時勢(出来事と省の重要度の増減)</li><li>国富(達成して残った成果)</li><li>レギュレーション(国力の計算を変えた記録)</li><li>国家運営規程</li></ul>';
  document.getElementById("ver").textContent = "版 " + APP_VERSION;
  const c = lsGet(KEY_CONN, null);
  document.getElementById("c-owner").value = c ? c.owner : "nisenonamae";
  document.getElementById("c-repo").value = c ? c.repo : "notion-daily";
  document.getElementById("c-branch").value = c ? c.branch : "main";
  document.getElementById("c-token").value = c ? c.token : "";
  const cache = lsGet(KEY_CACHE, null);
  if (cache) { state.gov = cache.gov; state.stats = cache.stats; state.reviews = cache.reviews || {}; state.reviewShas = cache.reviewShas || {};
               state.notes = cache.notes || { purposes: {} };
               Object.keys(state.reviews).forEach(m => state.loadedMonths.add(m)); render(); }
  if (c && c.token) { state.conn = c; loadAll(); } else showView("settings");
}
window.__sho = { pg, pages, nextLabel, condMet, openPage, staff, currentTerm, goalLine, issueProblems, state, periodStart, periodPrev, loadAll, colorOf, gov, amendStatus, standingStatus };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
