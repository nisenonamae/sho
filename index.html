/* ───────── 作戦期を立てる会議:情勢を見る → 論点 → 決めて発令 ───────── */
const KEY_DRAFT = "sho-term-draft";
function saveDraft(){ try { if (staff.draft) localStorage.setItem(KEY_DRAFT, JSON.stringify(staff.draft)); else localStorage.removeItem(KEY_DRAFT); } catch (e) {} }
function situation(){
  const ms = (state.gov && state.gov.ministries) || [], prev = staff.doc.terms.filter(t => t.closedAt).slice(-1)[0];
  const hist = (state.stats && state.stats.power_history) || [], from = prev ? prev.start : addDays(taskDay(), -30);
  const span = hist.filter(r => r.date >= from), R = r => r.real != null ? r.real : r.power;
  const power = span.length ? { from: span[0].date, to: span[span.length - 1].date, a: R(span[0]), b: R(span[span.length - 1]) } : null;
  const rows = ms.map(m => {
    const p = powerOf(m.tag) || {}, ts = state.tasks.filter(t => (t.def.ministries || []).includes(m.tag) && !["アーカイブ", "達成済み"].includes(t.status));
    const tEs = tide.doc.entries.filter(e => !e.deleted && e.type !== "cancel" && shareOf(e, m.tag) > 0);
    return { tag: m.tag, name: m.name, weight: p.weight != null ? +p.weight : null, territory: p.territory, dominance: p.dominance,
      tide: net(sumParts(tEs.map(e => scaleParts(tideAt(e, taskDay()), shareOf(e, m.tag))))), burden: tEs.filter(e => e.type === "plus").reduce((a, e) => a + (e.burden || 0) * remainRatio(e) * shareOf(e, m.tag), 0),
      fallen: ts.filter(t => t.status === "要再設定").length, waiting: ts.filter(t => t.waiting).length, tasks: ts.length };
  });
  const alerts = pages().filter(p => p.kind === "ALERT" && ["発生", "対応中"].includes(p.status));
  const raids = defenseTag() ? raidCandidates() : [];
  const cands = ((gov.council && gov.council.candidates) || []).filter(c => !c.status || c.status === "候補").slice(0, 6);
  return { prev, power, rows, alerts, raids, cands };
}
function meetingHtml(d, ms){
  const mt = d.meeting = d.meeting || { step: 1, issues: [], reason: "" };
  const steps = ["情勢を見る", "論点を出す", "決めて発令"];
  let h = '<div class="sec"><h3>作戦期を立てる会議</h3><div class="mtg-steps">' + steps.map((l, i) => '<span class="' + (mt.step === i + 1 ? "on" : mt.step > i + 1 ? "done" : "") + '">' + (i + 1) + " " + l + "</span>").join("") + "</div>";
  const addBtn = text => '<button type="button" class="linkbtn" data-issue-add="' + esc(text) + '">論点にする</button>';
  if (mt.step === 1) {

    if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    cell += ch;

}

    const cols = (j.cols || []).map(c => typeof c === "string" ? { name: c, type: "text" } : Object.assign({ type: "text" }, c));
    return { cols, rows: (j.rows || []).map(r => cols.map((c, i) => Array.isArray(r) ? clean(r[i]) : clean((r || {})[c.name]))) };

const ANALYSIS = [["breakdown", "超分解", "いちばん小さな動作まで分けると?"], ["invest", "設備投資", "続けるために整える道具・環境は?"],

function analysisFromBody(body){
  const out = {}; let cur = null;
  for (const ln of String(body).split("\n")) {
    const m = /^#{1,3}\s*(.+?)\s*$/.exec(ln);
    if (m) { const hit = ANALYSIS.find(a => a[1] === m[1].trim()); cur = hit ? hit[0] : null; continue; }
    if (cur && ln.trim()) out[cur] = ((out[cur] ? out[cur] + "\n" : "") + ln.trim().replace(/^-\s*/, ""));
  }
  return out;
}

/* ───────── RAID(防衛省の主体的な侵攻:止まった省を再始動できる状態に戻す) ───────── */
const RST = ["計画中", "侵攻中", "制圧", "引き渡し済み"];
const raidActive = p => ["計画中", "侵攻中"].includes(p.status);
// 侵攻の候補:要再設定のタスクが多い省・長く何も済ませていない省
function raidCandidates(){
  const dt = defenseTag(), ms = ((state.gov && state.gov.ministries) || []).filter(m => m.tag !== dt);
  const busy = new Set(pages().filter(p => isRaid(p) && raidActive(p)).flatMap(p => targetsOf(p)));
  const ts0 = state.tideState || {}, cred = ts0.credibility || {}, counted = ts0.counted || {};
  return ms.map(m => {
    const ts = state.tasks.filter(t => (t.def.ministries || []).includes(m.tag) && !["アーカイブ", "達成済み", "休止中"].includes(t.status));
    // 時勢と行動のずれ:気持ちを書いても計画が動かず、信用が記録の無いときの値(1/2)を下回った
    const gap = counted[m.tag] > 0 && cred[m.tag] != null && cred[m.tag] < 0.5 ? cred[m.tag] : null;
    if (!ts.length && gap == null) return null;
    const fall = ts.filter(t => t.status === "要再設定").length;
    const last = ts.map(t => t.lastDone).filter(Boolean).sort().pop() || null;
    const idle = last ? Math.round((Date.parse(taskDay()) - Date.parse(last)) / 864e5) : null;
    const score = (ts.length ? fall / ts.length + (idle == null ? 1 : Math.min(1, idle / 14)) : 0) + (gap != null ? 0.5 - gap : 0);
    const stuck = ts.length && (fall >= 3 || fall / ts.length >= 0.5 || (idle != null && idle >= 7));
    if (!stuck && gap == null) return null;
    return { m, fall, all: ts.length, idle, score, busy: busy.has(m.tag), gap, stuck };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
}

async function commitReview(month, mutate){
  const path = P.reviews + "/" + month + ".json";
  const before = JSON.stringify(state.reviews[month] || {});
  mutate();
  const bo = JSON.parse(before), af = state.reviews[month] || {};
  Object.keys(af).forEach(k => { if (JSON.stringify(af[k]) !== JSON.stringify(bo[k]) && af[k] && af[k].tag) logPlan([af[k].tag], "首脳を書いた", k, ""); });
  render();
  for (let i = 0; i < 3; i++) {
    try {
      state.reviewShas[month] = await writeJson(path, state.reviews[month] || {}, state.reviewShas[month] || null);
      lsSet(KEY_CACHE, { gov: state.gov, stats: state.stats, reviews: state.reviews, reviewShas: state.reviewShas });
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(path);
        state.reviews[month] = fresh.data || {}; state.reviewShas[month] = fresh.sha;
        mutate(); render(); continue;
      }
      const s = document.getElementById("rv-status"); if (s) { s.textContent = e.message || "保存できませんでした"; s.classList.add("err"); }
      return false;
    }
  }
  return false;
}
function entryFor(month, key, tag, kind, start){
  const mo = state.reviews[month] = state.reviews[month] || {};
  return mo[key] = mo[key] || { tag, period: kind, start, c: "", orders: [] };
}

  if (!state.conn || !state.conn.token) { say("先に設定で接続してください。", true); return; }
  const before = (await readJson(P.gov).catch(() => ({}))).sha || null;
  say("Notionから書き出しています…(1分ほど)");

function applyCheck(s, dec, val, note){
  const c = s.checks[dec.id] || (s.checks[dec.id] = { prev: { st: dec.st, checkAt: dec.checkAt }, val: null, note: "", ag: null });
  // いったん元に戻してから当てはめる(押し直しても二重にならない)
  dec.results = (dec.results || []).filter(r => r.sess !== s.id);
  dec.st = c.prev.st; dec.checkAt = c.prev.checkAt; dec.keep = false;
  if (c.ag && D.agendas[c.ag]) { touch(Object.assign(D.agendas[c.ag], { del: true })); c.ag = null; }
  if (c.val !== val) c.stop = null;
  c.val = val; if (note != null) c.note = note;
  if (val) {
    dec.results.push({ sess: s.id, no: s.no, at: today(), v: val, note: c.note, natt: c.natt || null });
    const prevOk = dec.results.length >= 2 && dec.results[dec.results.length - 2].v === "効いた";
    if (val === "効いた" && prevOk) dec.st = "ended";
    else if (val === "効いた" || val === "少し効いた") dec.checkAt = addDays(today(), dec.every || 7);
    else {
      dec.st = "cont";
      const old = dec.agenda && D.agendas[dec.agenda];
      const a = { id: rid(), x: old ? old.x : dec.text, at: now(), st: "cont", contN: ((old && old.contN) || 0) + 1, dec: dec.id, why: val, u: now() };
      D.agendas[a.id] = a; c.ag = a.id;
    }
  }
  touch(dec);
}

function dn(s, d){ if (!d) return 0; const ids = s.parts.filter(p => p.t === "debate" && s.debates[p.d]).map(p => p.d); const i = ids.indexOf(d.id); return i >= 0 ? i + 1 : d.n; }

    const d = s.debates[p.d], r = rootOf(s, d), ag = d.dyn ? null : d.agenda || r.agenda;

// 世論の変化を発言録に残す(理由はなくてよい)
function yoCommit(s){

async function copyText(t){

let toastT = null;

/* ───────── 時計 ───────── */
let lastAlive = 0;
function tick(force){
  const s = S(); if (!s) return;
  const tm = $("#hy-tm"); if (tm) { tm.textContent = hms(liveElapsed(s)); tm.classList.toggle("over", !!s.limit && liveElapsed(s) > s.limit * 60000); }
  const cp = curPart(s), d = cp && cp.d && s.debates[cp.d], dt = $("#hy-dtm");
  if (d && dt && !s.limit) dt.textContent = "経過 " + ms2(debUsed(s, d));
  else if (d && dt) { const left = d.min * 60000 - debUsed(s, d); dt.textContent = "残り " + ms2(left); dt.classList.toggle("w", left < 120000);
    if (!force && left < 180000 && left > 178500 && U.view === "sess") render(); }
  if (s.run && now() - lastAlive > 10000) { lastAlive = now(); alive(); }
}

/* ───────── 同期(notion-daily に 1 つのファイル) ─────────
   手元が正。開いたとき・戻ったときに取りに行って混ぜ、変えたら少し待って送る。
   混ぜ方:議題・決定・会・あとで は id ごとに新しいほう(u)、設定と「いまの会」も新しいほう。 */
function merge(a, b){
  if (!b) return a; if (!a) return b;
  const out = normalize(JSON.parse(JSON.stringify(a)));
  ["agendas", "decisions", "sessions", "later", "kijun", "threads", "news"].forEach(k => { Object.entries(b[k] || {}).forEach(([id, x]) => { const y = out[k][id]; if (!y || (x.u || 0) > (y.u || 0)) out[k][id] = x; }); });
  if ((b.settings && b.settings.u || 0) > (out.settings.u || 0)) out.settings = Object.assign(defaults().settings, b.settings);
  if ((b.curU || 0) > (out.curU || 0)) { out.cur = b.cur; out.curU = b.curU; }
  if (out.settings.noManual) out.settings.nextNo = Math.max(out.settings.nextNo || 1, ...Object.values(out.sessions).filter(s => !s.del).map(s => (s.no || 0) + 1));
  return out;
}
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const api = () => "https://api.github.com/repos/" + encodeURIComponent(NET.conn.owner) + "/" + encodeURIComponent(NET.conn.repo) + "/contents/" + DATA_PATH;
const hdr = x => Object.assign({ "Authorization": "Bearer " + NET.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRemote(){
  const r = await fetch(api() + "?ref=" + encodeURIComponent(NET.conn.branch || "main") + "&t=" + now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) { NET.sha = null; return null; }
  if (!r.ok) throw new Error("読み込み " + r.status);
  const j = await r.json(); NET.sha = j.sha;
  let txt = j.content ? b64d(j.content) : null;
  if (!txt && j.download_url) { const r2 = await fetch(j.download_url, { cache: "no-store" }); txt = await r2.text(); }
  return txt ? JSON.parse(txt) : null;
}
async function pull(){
  if (!NET.conn || !NET.conn.token) return;
  NET.busy = true; updSaved();
  try {
    const remote = await fetchRemote();
    const before = JSON.stringify(D);
    D = merge(D, remote); saveLocal();
    NET.state = "";
    const changed = JSON.stringify(D) !== before;
    if (!remote || JSON.stringify(remote) !== JSON.stringify(D)) NET.dirty = true;
    NET.busy = false;
    if (changed) { checkSudden(); render(); } else updSaved();
    if (NET.dirty) queuePush(300);
  } catch (e) { NET.busy = false; NET.state = "err"; updSaved(); console.warn(e); }
}
function queuePush(ms){ NET.dirty = true; updSaved(); clearTimeout(NET.timer); NET.timer = setTimeout(push, ms == null ? 1500 : ms); }
async function push(){
  if (!NET.conn || !NET.conn.token || !NET.dirty) { updSaved(); return; }
  if (NET.busy) { queuePush(800); return; }
  NET.busy = true;
  try {
    for (let tries = 0; tries < 3; tries++) {
      const body = { message: "最高評議会を更新", content: b64e(JSON.stringify(D)), branch: NET.conn.branch || "main" };
      if (NET.sha) body.sha = NET.sha;
      const r = await fetch(api(), { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
      if (r.ok) { const j = await r.json(); NET.sha = j.content && j.content.sha; NET.dirty = false; NET.state = ""; break; }
      if (r.status === 409 || r.status === 422) { const remote = await fetchRemote(); D = merge(D, remote); saveLocal(); continue; }
      throw new Error("保存 " + r.status);
    }
  } catch (e) { NET.state = "err"; console.warn(e); }
  NET.busy = false; updSaved();
}
function updSaved(){ const el = $(".saved"); if (el) el.outerHTML = savedLabel(); }
function findConn(){
  const sho = lsGet("sho-conn", null);
  if (sho && sho.token && sho.owner) return { owner: sho.owner, repo: sho.repo || "notion-daily", branch: sho.branch || "main", token: sho.token, from: "省" };
  const mine = lsGet(K_CONN, null); if (mine && mine.token) return mine;
  // ほかのアプリ(同じ nisenonamae.github.io)で入れたトークンを借りる
  const keys = ["sho-conn", "kenseiin-conn"]; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/conn/i.test(k) && !keys.includes(k) && k !== K_CONN) keys.push(k); } } catch (e) {}
  for (const k of keys) { const c = lsGet(k, null); if (c && typeof c === "object" && c.token && c.owner) { const x = { owner: c.owner, repo: "notion-daily", branch: c.branch || "main", token: c.token, from: k.replace(/-conn$/, "") }; if (c.repo === "notion-daily" || !c.repo) { lsSet(K_CONN, x); return x; } } }
  return null;
}

/* ───────── 急に閉じたとき ───────── */
function checkSudden(){
  const s = S(); if (!s || !s.run) return;
  const la = Math.max(+(localStorage.getItem(K_ALIVE) || 0), s.u || 0, s.since);
  if (now() - la < 120000) return;                 // すぐ戻ってきたなら、そのまま続ける
  s.elapsed += Math.max(0, la - s.since); const cp = curPart(s); if (cp && cp.d && s.debates[cp.d]) s.debates[cp.d].used += Math.max(0, la - s.since);
  s.since = la; s.run = false; s.pauses = s.pauses || []; s.pauses.push({ at: la, why: "急に閉じた", when: "", part: s.cur });
  const d = cp && cp.d && s.debates[cp.d]; if (d && d.e.length && d.e[d.e.length - 1].k !== "pause") d.e.push({ id: rid(), k: "pause", at: la });
  touch(s); U.view = "home"; saveLocal(); queuePush();
}

/* ───────── 起動(省の「政府 › 最高評議会」に組み込む) ─────────
   省の renderSupreme が HY.mount(箱, { back, legacy }) を呼ぶ。省が描き直すたびに呼ばれてよい。 */

window.HY = { mount, running: () => { const s = S(); return !!(s && s.run); }, get D(){ return D; }, U, merge, parseAnswer, buildPrompt: () => buildPrompt(S()), groups: () => groups(S()), render };

})();
