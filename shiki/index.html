<body>
<div id="app"></div><div id="sheet"></div><div id="tip"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* 史記 — ブロックを積み木のように組んだ記録(ユニット)を毎日積み、観点と年表で眺める */
const VER = "s2.10";
const DATA_PATH = "roadmap/apps/shiki/data.json", OLD_PATH = "roadmap/apps/hyogikai/data.json";
const K_DATA = "shiki-data", K_UI = "shiki-ui";
const $ = (q, r) => (r || document).querySelector(q);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const md = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
const mdS = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate(); };
const ymdJ = s => { const d = new Date(s + "T00:00:00"); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const cut = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const now = () => Date.now();
const rid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const hsh = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };

// 種類:出来事(まわりで起きた)・行動(自分がした)= 情勢。心の中 = 主観
const NKIND = [{ id: "w", n: "出来事", c: "#2F4F8A", land: "#E6E9EE", place: "世の中" }, { id: "a", n: "行動", c: "#3F7A55", land: "#E4EBDD", place: "自分の国" }, { id: "h", n: "心の中", c: "#8A5A9A", land: "#EFE6F1", place: "心の島" }];
const EMO_KW = [["評議会", "🏛️"], ["憲法", "📜"], ["報道", "📰"], ["史記", "📰"], ["年表", "📰"], ["国力", "🧭"], ["大計", "🗺️"], ["行軍表", "🗺️"], ["通知", "🔔"], ["アプリ", "📱"], ["決め", "⚖️"],
  ["青チャート", "📐"], ["数学", "📐"], ["計算", "🧮"], ["リスニング", "🎧"], ["英作文", "✏️"], ["単語", "🔤"], ["英語", "📘"], ["Anki", "🗂"], ["授業", "🏫"], ["模試", "📝"], ["試験", "📝"],
  ["本屋", "📚"], ["映画", "🎬"], ["勝", "🏆"], ["雨", "☔"], ["散歩", "🚶"], ["バイト", "💼"], ["電車", "🚃"], ["風呂", "♨️"], ["寝", "🛌"], ["家族", "🏠"], ["買", "🛍"], ["旅", "🧳"], ["食", "🍚"], ["本", "📚"]];
const EMO_DEF = { w: ["🌤️", "📣", "🏠", "🗞️"], a: ["✏️", "🧭", "🔧", "📘"], h: ["💭", "🌙", "🌱", "⚡"] };
const EMO_PICK = ["🏛️", "⚖️", "📜", "📰", "🧭", "🗺️", "🔔", "📱", "📐", "🧮", "📘", "✏️", "🎧", "🔤", "🗂", "🏫", "📝", "📚", "🎬", "🏆", "☔", "🚶", "💼", "🚃", "♨️", "🛌", "🏠", "🛍", "🧳", "🍚", "☕️", "🌤️", "🎉", "⚡", "🌱", "🔥", "💭", "🌙"];
const ERA_COL = ["#6B4C9A", "#3F7A55", "#B8432F", "#2F4F8A", "#A9761C", "#7D4A8C"];

// 段:ユニットが主にどれか(土台の色)
const CAT = [{ id: "o", n: "客観", c: "#2F4F8A", base: "#E1E7F0" }, { id: "s", n: "主観", c: "#8A5A9A", base: "#EDE2EC" }, { id: "j", n: "時代", c: "#3F7A55", base: "#E3EDE4" }, { id: "h", n: "歴史", c: "#B8432F", base: "#F2E1DC" }];
const catOf = id => CAT.find(c => c.id === id) || CAT[0];
// 選択肢は2段。上の段=種類(Claude が決める。ほぼ増えない)、下の段=中身(自分で無限に足せる)
// 観点はふだん種類で描き、中身は細い層として同じ絵に入る(押すと種類の中だけに分かれる)
const GRP = {
  act: [["study", "勉強", "📚", "#3F6FB0", ["青チャート", "英単語", "Anki", "鉄緑の授業"]], ["make", "つくる", "🛠", "#C97F2E", ["アプリづくり", "動画づくり"]], ["move", "体を動かす", "🏃", "#4F8A6B", ["散歩", "筋トレ"]],
    ["rest", "休む", "🛌", "#8A7FB8", ["寝た", "ぼーっと"]], ["life", "生活", "🍚", "#A8841E", ["ごはん", "お風呂", "家事"]], ["screen", "スマホ・画面", "📱", "#B8553F", ["スマホ", "動画", "ゲーム"]], ["ppl", "人と", "👥", "#4E8E8A", ["話した", "出かけた"]]],
  place: [["home", "家", "🏠", "#A8841E", ["自分の部屋", "リビング"]], ["school", "学校・塾", "🏫", "#3F6FB0", ["鉄緑"]], ["out", "外", "🌳", "#4F8A6B", ["本屋", "公園", "カフェ"]], ["trans", "移動中", "🚃", "#6F7A87", ["電車", "歩き"]]],
  why: [["body", "体", "🛌", "#6F7A87", ["眠くて", "つかれて", "お腹がすいて"]], ["mind", "気持ち", "💭", "#B0699A", ["不安で", "飽きて"]], ["task", "やること", "📐", "#3F6FB0", ["わからなくて", "多すぎて", "つまらなくて"]],
    ["env", "まわり", "📱", "#C97F2E", ["通知が来て", "話しかけられて"]], ["vague", "なんとなく", "🌀", "#9C917C", ["なんとなく"]]],
  feel: [["bright", "明るい", "☀️", "#E2B23C", ["うれしい", "たのしい", "やる気"]], ["calm", "おだやか", "🌿", "#6FAF8E", ["ほっとした", "落ち着いた"]], ["heavy", "重い", "🌧", "#6F86B0", ["不安", "さみしい", "つかれた"]], ["rough", "荒れ", "⚡", "#C9584A", ["イライラ", "逃げたい"]]],
  who: [["self", "ひとり", "🧍", "#9C917C", ["ひとり"]], ["fam", "家族", "🏠", "#A8841E", ["家族"]], ["fr", "友達", "🙌", "#4F8A6B", ["友達"]], ["tch", "先生", "🏫", "#3F6FB0", ["先生"]]]
};
const ETC = ["etc", "ほか", "・", "#9C917C", []];
const POOL = { amt: ["ちょっと", "ふつう", "たっぷり"] };
Object.entries(GRP).forEach(([p, gs]) => { POOL[p] = [].concat(...gs.map(g => g[4])); });
const FIXED = { amt: true };
const grpList = p => (GRP[p] || []).concat(Object.values(D.opts).some(o => o && !o.del && o.p === p && (!o.g || o.g === "etc")) || usedEtc(p) ? [ETC] : []);
// その中身がどの種類か(自分で足したものは足したときの種類。わからないものは「ほか」)
function gOf(p, v){ for (const g of GRP[p] || []) if (g[4].includes(v)) return g; const o = Object.values(D.opts).find(o => o && !o.del && o.p === p && o.v === v); return (o && (GRP[p] || []).find(g => g[0] === o.g)) || ETC; }
function usedEtc(p){ return false; }
function grpItems(p, gid){ const g = (GRP[p] || []).find(x => x[0] === gid); return Array.from(new Set((g ? g[4] : []).concat(Object.values(D.opts).filter(o => o && !o.del && o.p === p && (o.g || "etc") === gid).map(o => o.v)))); }
const FEEL_E = { "うれしい": "😊", "たのしい": "😆", "ほっとした": "😌", "落ち着いた": "🍵", "やる気": "🔥", "不安": "😟", "イライラ": "😤", "逃げたい": "🫠", "つかれた": "😮‍💨", "さみしい": "🥲" };
// ブロック(作るのは Claude。中身の形が決まっているので、年表での見せ方も決められる)
const BK = {
  deki: { n: "できごと", c: "#5B7DB1", w: 2, f: [{ k: "x", n: "なにが起きた", t: "text", ph: "起きたこと" }] },
  kodo: { n: "行動", c: "#4F8A6B", w: 2, f: [{ k: "what", n: "なにを", t: "pick", p: "act" }, { k: "amt", n: "どれだけ", t: "pick", p: "amt" }, { k: "x", n: "ひとこと(書きたいときだけ)", t: "text", ph: "書かなくていい" }] },
  kimo: { n: "気持ち", c: "#B0699A", w: 1, f: [{ k: "kind", n: "どんな", t: "pick", p: "feel" }, { k: "lv", n: "強さ", t: "scale" }] },
  kikk: { n: "きっかけ", c: "#C97F2E", w: 2, f: [{ k: "when", n: "いつ", t: "time" }, { k: "where", n: "どこで", t: "pick", p: "place" }, { k: "doing", n: "何をしていて", t: "pick", p: "act" }, { k: "why", n: "なぜ", t: "pick", p: "why" }] },
  riyu: { n: "理由", c: "#B8553F", w: 2, f: [{ k: "why", n: "なぜ", t: "pick", p: "why" }] },
  jikn: { n: "時間", c: "#6F7A87", w: 1, f: [{ k: "min", n: "何分", t: "num", o: [5, 10, 15, 30, 45, 60, 90, 120] }] },
  dare: { n: "だれと", c: "#A8841E", w: 1, f: [{ k: "who", n: "だれと", t: "multi", p: "who" }] },
  bash: { n: "場所", c: "#4E8E8A", w: 1, f: [{ k: "where", n: "どこ", t: "pick", p: "place" }] },
  hito: { n: "ひとこと", c: "#9C917C", w: 2, paper: true, f: [{ k: "x", n: "ひとこと", t: "text", ph: "自由に書く(まだブロックがないことも、ここに)" }] }
};
const BK_ORDER = ["deki", "kodo", "kimo", "kikk", "riyu", "jikn", "dare", "bash", "hito"];
const bkOf = k => BK[k] || BK.hito;

function normalize(d){ d = d && typeof d === "object" ? d : {}; ["news", "eras", "issues", "bands", "units", "opts"].forEach(k => { if (!d[k] || typeof d[k] !== "object") d[k] = {}; }); d.settings = Object.assign({ u: 0, imp: false }, d.settings || {}); return d; }
let D = normalize(lsGet(K_DATA, null));
const U = Object.assign({ tab: "r", z: "w", nh: false }, lsGet(K_UI, {}), { sheet: null, arg: null, lim: 120, bottom: true, unit: null, draft: null, tedit: false, listY: 0, toY: null });
if (!["n", "v"].includes(U.tab)) U.tab = "r";
const NET = { conn: null, sha: null, state: "", dirty: false, timer: null, busy: false };
const touch = o => { if (o) o.u = now(); return o; };
function saveLocal(){ lsSet(K_DATA, D); }
function saveUI(){ lsSet(K_UI, { tab: U.tab, z: U.z, nh: U.nh, view: U.view, vr: U.vr }); }
function mut(fn){ fn(); saveLocal(); saveUI(); queuePush(); render(); }
function quiet(fn){ fn(); saveLocal(); queuePush(); }
// 省アプリの中の「報道」で記したものを、いちどだけ引きつぐ
function takeOld(old){ if (!old) return 0; let n = 0; Object.values(old.news || {}).forEach(x => { if (!x || !x.id || !String(x.x || "").trim()) return; const y = D.news[x.id]; if (!y || (x.u || 0) > (y.u || 0)) { D.news[x.id] = { id: x.id, x: x.x, t: x.t, at: x.at, day: x.day, u: x.u || now(), e: x.e, top: x.top, auto: x.auto, del: x.del }; n++; } });
  Object.values(old.eras || {}).forEach(e => { if (e && e.id && !D.eras[e.id]) { D.eras[e.id] = e; n++; } }); return n; }
// 前の形(字だけの記録)を、ブロック1つのユニットにする。いつ・どの端末でやっても同じ結果になる
function migrate(){ let n = 0; Object.values(D.news).forEach(x => { if (!x || !x.id) return; const id = "n" + x.id, y = D.units[id]; if (y ? (y.u || 0) >= (x.u || 0) : x.del) return;
  const t = new Date(x.at || 0), at = new Date((x.day || today()) + "T" + pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":00").getTime(), k = x.t === "w" ? "deki" : x.t === "h" ? "hito" : "kodo";
  D.units[id] = { id, at: isNaN(at) ? (x.at || now()) : at, day: x.day || today(), u: x.u || 1, cat: x.t === "h" ? "s" : "o", bl: [{ id: "b0", k, v: { x: x.x || "" } }], e: x.e, b: x.b, top: x.top, del: x.del }; n++; }); return n; }
if (!lsGet("shiki-impL", false)) { takeOld(lsGet("hyogikai-data", null)); lsSet("shiki-impL", true); }
if (migrate()) saveLocal();

const unitList = () => Object.values(D.units).filter(x => x && !x.del && x.bl && x.bl.length).sort((a, b) => a.at - b.at);
const uCat = u => u.cat || (u.bl.some(b => b.k === "deki" || b.k === "kodo") ? "o" : u.bl.some(b => b.k === "kimo") ? "s" : "o");
function bSum(b){ const v = b.v || {}, t = s => String(s || "").trim();
  switch (b.k) {
    case "deki": case "hito": return t(v.x);
    case "kodo": return [v.what, v.amt].filter(Boolean).join("・") + (t(v.x) ? (v.what || v.amt ? "\n" : "") + t(v.x) : "");
    case "kimo": return v.kind || "";
    case "kikk": return [v.when, v.where && v.where + "で", v.doing && v.doing + "をしていて", v.why].filter(Boolean).join(" ");
    case "riyu": return v.why || "";
    case "jikn": return v.min ? v.min + "分" : "";
    case "dare": return (v.who || []).join("・");
    case "bash": return v.where || "";
  } return ""; }
const NAME_ORDER = ["deki", "kodo", "kimo", "hito", "riyu", "kikk", "bash", "dare", "jikn"];
function uName(u){ for (const k of NAME_ORDER) { const b = u.bl.find(x => x.k === k && bSum(x)); if (b) return cut(bSum(b).split("\n")[0], 30); } return u.bl.map(b => bkOf(b.k).n).join("・") || "新しい記録"; }
function uEmo(u){ const f = u.bl.find(b => b.k === "kimo" && b.v && FEEL_E[b.v.kind]); const nm = uName(u), hit = EMO_KW.find(([w]) => nm.includes(w)); if (hit) return hit[1]; if (f) return FEEL_E[f.v.kind];
  const d = EMO_DEF[uCat(u) === "s" ? "h" : uCat(u) === "o" ? "a" : "w"]; return d[hsh(u.id) % d.length]; }
function uFull(u){ return [uName(u)].concat(u.bl.map(b => bSum(b).replace(/\n/g, " ")).filter(s => s && s !== uName(u))).join(" / "); }
// 年表に載せる形
function chronEntries(){ return unitList().map(u => { const c = catOf(uCat(u)); return { id: u.id, day: u.day, at: u.at, t: c.id === "s" ? "h" : "a", c: c.c, kn: c.n, x: uFull(u), e: u.e || uEmo(u), b: u.b, top: u.top }; }); }
// 選択肢:よく使うものから並ぶ
