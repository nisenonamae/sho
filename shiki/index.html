const VER = "s2.60";
const DATA_PATH = "roadmap/apps/shiki/data.json", OLD_PATH = "roadmap/apps/hyogikai/data.json";

const $ = (q, r) => (r || document).querySelector(q);

function bSum(b){ const v = b.v || {}, t = s => String(s || "").trim();
  switch (b.k) {
    case "deki": case "hito": return t(v.x);
    case "kodo": return [v.what, v.amt].filter(Boolean).join("・") + (t(v.x) ? (v.what || v.amt ? "\n" : "") + t(v.x) : "");
    case "kimo": return v.kind || "";
