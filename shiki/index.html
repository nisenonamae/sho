<body>
<div id="app"></div><div id="sheet"></div><div id="tip"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* 史記 — 毎日の情勢(出来事・行動)と主観(心の中)を記し、年表で眺める */
const VER = "s1.30";
const DATA_PATH = "roadmap/apps/shiki/data.json", OLD_PATH = "roadmap/apps/hyogikai/data.json";
const K_DATA = "shiki-data", K_UI = "shiki-ui";
const $ = (q, r) => (r || document).querySelector(q);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const md = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
const mdS = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate(); };
const ymdJ = s => { const d = new Date(s + "T00:00:00"); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const cut = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const now = () => Date.now();
const rid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

    '<button class="bigbtn" style="--bc:' + (isTop ? "var(--sub)" : "var(--ink)") + ';margin-top:.8rem" data-ha="top" data-hv="' + x.id + '">' + (isTop ? "この日の一面になっている" : "この日の一面にする") + "<small>" + (isTop ? (x.top ? "もう一度押すと、自動の選び方に戻る" : "自動で選ばれた") : "年表で、絵つきの大きい印になる") + "</small></button>" +
    '<div class="links" style="margin-top:.8rem"><button data-ha="del" data-hv="' + x.id + '">これを消す</button><span></span></div><button class="bigbtn" data-ha="close">これでいい</button>');
}
function sheetList(){
  const a = U.arg || {}, all = newsList(), tops = nTops(all), xs = all.filter(x => x.day >= a.from && x.day <= a.to && pinBand(x) === (a.b || null) && (U.nh || kindOf(x) !== "h")), days = Array.from(new Set(xs.map(x => x.day)));
  return sheetWrap("<h3>" + (a.from === a.to ? md(a.from) : mdS(a.from) + "〜" + mdS(a.to)) + '</h3><p class="d">' + xs.length + " 件</p>" +
    days.map(d => '<div class="nld">' + md(d) + "</div>" + xs.filter(x => x.day === d).map(x => '<button class="nli" style="--lc:' + kInfo(kindOf(x)).c + '" data-ha="edit" data-hv="' + x.id + '"><span>' + emoOf(x) + "</span><b" + (tops[d] === x.id ? ' class="tp"' : "") + ">" + esc(x.x || "(字なし)") + "</b></button>").join("")).join("") + '<button class="bigbtn" data-ha="close">とじる</button>');
}

/* ───────── 描画 ───────── */
function savedLabel(){ if (!NET.conn) return '<span class="saved">✓ 手元に保存済み(省アプリでつなぐと、ほかの端末にも出る)</span>'; return '<span class="saved' + (NET.state === "err" ? " err" : "") + '">' + (NET.state === "err" ? "！ つながらない(手元には保存済み)" : NET.busy || NET.dirty ? "… 保存中" : "✓ 保存済み") + "</span>"; }
function updSaved(){ const el = $(".saved"); if (el) el.outerHTML = savedLabel(); }
function render(){
  const app = $("#app"), y = window.scrollY, ae = document.activeElement, aid = ae && ae.id, all = newsList();
  const tl0 = $("#sk-tl"), tls = tl0 ? { l: tl0.scrollLeft, z: tl0.dataset.z, end: tl0.scrollWidth - tl0.scrollLeft - tl0.clientWidth < 30 } : null;
  let sel = null; try { if (aid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}

    (tab === "n" ? viewChron(all) : viewStream(all)) + (tab === "n" ? '<p class="foot">' + savedLabel() + "<span>史記 " + VER + "</span></p>" : "");
  $("#sheet").innerHTML = U.sheet === "edit" ? sheetEdit() : U.sheet === "list" ? sheetList() : U.sheet === "band" ? sheetBand() : "";
  document.body.classList.toggle("lock", !!U.sheet);
  { const tl = $("#sk-tl"); if (tl) { if (!tls || tls.z !== tl.dataset.z) tl.scrollLeft = +tl.dataset.td >= 0 ? Math.max(0, +tl.dataset.td - tl.clientWidth * 0.78) : 0; else tl.scrollLeft = tls.l; } }
  if (U.bottom) { U.bottom = false; window.scrollTo(0, (tab === "j" || tab === "s") ? document.documentElement.scrollHeight : 0); }
  else if (U.keep) { window.scrollTo(0, y + document.documentElement.scrollHeight - U.keep); U.keep = 0; }
  else if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  if (aid) { const n = document.getElementById(aid); if (n && n !== ae) { n.focus({ preventScroll: true }); if (sel) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
document.addEventListener("mouseover", ev => { const t = ev.target.closest && ev.target.closest("[data-tip]"), tip = $("#tip"); if (!tip) return; if (!t) { tip.classList.remove("on"); return; }
  tip.textContent = t.dataset.tip; tip.classList.add("on"); const r = t.getBoundingClientRect(), w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px"; });
let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }

/* ───────── 操作 ───────── */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-ha]"); if (!b || b.disabled) return; const a = b.dataset.ha, v = b.dataset.hv;
  switch (a) {
    case "tab": U.tab = v; U.bottom = true; U.lim = 80; U.draw = null; saveUI(); render(); return;
    case "post": { const x = (($("#sk-in") || {}).value || "").trim(); if (!x) { toast("字を書いてから押す"); const el = $("#sk-in"); el && el.focus(); return; }
      const t = NKIND.some(k => k.id === v) ? v : "a", here = (t === "h") === (U.tab === "s"); U.bottom = true;
      mut(() => { newsAdd({ x, t }); U.nq = { x: "" }; }); toast(here ? "記した" : (t === "h" ? "主観に記した" : "情勢に記した")); return; }
    case "mic": { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR || U.mic) return; const r = new SR(); r.lang = "ja-JP"; r.interimResults = false; U.nq.x = ($("#sk-in") || {}).value || "";
      r.onresult = e => { U.nq.x = (U.nq.x ? U.nq.x + " " : "") + e.results[0][0].transcript; }; r.onend = () => { U.mic = false; render(); }; r.onerror = () => { U.mic = false; toast("声を聞き取れなかった"); render(); };
      U.mic = true; render(); try { r.start(); } catch (e) { U.mic = false; render(); } return; }
    case "more": U.lim += 150; U.keep = document.documentElement.scrollHeight; render(); return;
    case "edit": U.sheet = "edit"; U.arg = { id: v }; render(); return;
    case "close": U.sheet = null; render(); return;
    case "del": if (!confirm("これを消しますか。")) return; U.sheet = null; mut(() => { touch(Object.assign(D.news[v], { del: true })); }); return;
    case "ek": mut(() => { const x = D.news[U.arg.id]; x.t = v; touch(x); }); return;
    case "ee": mut(() => { const x = D.news[U.arg.id]; if (x.e === v) delete x.e; else x.e = v; touch(x); }); return;
    case "top": mut(() => { const x = D.news[v]; if (x.top) delete x.top; else { newsList().filter(y => y.day === x.day && y.top).forEach(y => { delete y.top; touch(y); }); x.top = true; } touch(x); }); return;
    case "nh": U.nh = !U.nh; saveUI(); render(); return;
    case "z": U.z = v; saveUI(); render(); return;
    case "list": { const [f, t, bb] = v.split("|"); U.sheet = "list"; U.arg = { from: f, to: t, b: bb || null }; render(); return; }
    case "bopen": if (U.draw) return; U.band = v; U.z = "f"; render(); return;
    case "bgo": U.band = v || null; U.draw = null; if (!v && U.z === "f") U.z = "w"; render(); return;
    case "bdraw": U.draw = {}; render(); return;
    case "bcancel": U.draw = null; render(); return;
    case "bnow": bandMake(U.draw.from, null); return;
    case "bedit": U.sheet = "band"; U.arg = { id: v }; render(); return;
    case "bongo": mut(() => { const x = D.bands[v]; x.to = x.to ? null : today(); if (x.to && x.to < x.from) x.to = x.from; touch(x); }); return;
    case "bcol": mut(() => { const x = D.bands[U.arg.id]; x.c = v; touch(x); }); return;
    case "bmove": mut(() => { const x = D.bands[U.arg.id]; x.y = Math.max(0, (x.y || 0) + (+v)); touch(x); }); return;
    case "bhei": mut(() => { const x = D.bands[U.arg.id]; x.h = Math.max(1, Math.min(5, (x.h || 1) + (+v))); touch(x); }); return;
    case "bdel": { if (!confirm("この帯を消しますか(記したものは消えない)。")) return; const x = D.bands[v], par = x.parent || null; U.sheet = null; if (U.band === v) U.band = par;
      mut(() => { kidsOf(v).forEach(k => { k.parent = par; touch(k); }); Object.values(D.news).forEach(n => { if (n.b === v) { n.b = par; touch(n); } }); touch(Object.assign(x, { del: true })); }); return; }
    case "eb": mut(() => { const x = D.news[U.arg.id]; x.b = v || null; touch(x); }); return;
  }
});
function bandMake(from, to){ const cur = U.band ? D.bands[U.band] : null; if (to && to < from) { const t = from; from = to; to = t; }
  if (cur) { if (from < cur.from) from = cur.from; if (to && cur.to && to > cur.to) to = cur.to; }
  const n = (prompt("この帯の名前(時代・取り組みの名前)") || "").trim(); U.draw = null; if (!n) { render(); return; }
  mut(() => { const id = rid(), par = cur ? cur.id : null, base = cur ? (cur.c || BCOL[0]) : BCOL[kidsOf(null).length % BCOL.length];
    D.bands[id] = { id, n, from, to, parent: par, c: cur ? tint(base, 0.28) : base, y: freeLane(par, from, to || today()), h: 1, u: now() }; }); toast("帯を引いた"); }
document.addEventListener("click", ev => { if (!U.draw || U.tab !== "n") return; const inn = ev.target.closest(".chin"); if (!inn || ev.target.closest(".tc,.tt,.tb,.tmore")) return;
  const r = inn.getBoundingClientRect(), d = addDays(inn.dataset.from, Math.max(0, Math.floor((ev.clientX - r.left) / +inn.dataset.dw))), day = d > today() ? today() : d;
  if (!U.draw.from) { U.draw.from = day; render(); } else bandMake(U.draw.from, day); });
document.addEventListener("input", ev => { const t = ev.target, k = t.dataset && t.dataset.hin; if (!k) return;
  if (k === "in") { U.nq.x = t.value; return; }
  if (k === "bn") { quiet(() => { const x = D.bands[t.dataset.hv]; if (x && t.value.trim()) { x.n = t.value.trim(); touch(x); } }); return; }
  if (k === "bf" || k === "bt") { if (/^\d{4}-\d\d-\d\d$/.test(t.value) && t.value <= today()) quiet(() => { const x = D.bands[t.dataset.hv]; if (!x) return; if (k === "bf" && t.value <= bEnd(x)) x.from = t.value; if (k === "bt" && t.value >= x.from) x.to = t.value; touch(x); }); return; }
  if (k === "ex") { quiet(() => { const x = D.news[t.dataset.hv]; if (x) { x.x = t.value; touch(x); } }); return; }
  if (k === "eday") { if (/^\d{4}-\d\d-\d\d$/.test(t.value) && t.value <= today()) quiet(() => { const x = D.news[t.dataset.hv]; if (x) { x.day = t.value; touch(x); } }); return; }
});

/* ───────── 同期(省アプリのトークンを借りる。新しいトークンは作らない) ───────── */
function merge(a, b){ if (!b) return a; const out = normalize(JSON.parse(JSON.stringify(a))); ["news", "eras", "issues", "bands"].forEach(k => { Object.entries(b[k] || {}).forEach(([id, x]) => { const y = out[k][id]; if (!y || (x.u || 0) > (y.u || 0)) out[k][id] = x; }); }); if ((b.settings && b.settings.u || 0) > (out.settings.u || 0)) out.settings = Object.assign({ u: 0, imp: false }, b.settings); return out; }
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const api = p => "https://api.github.com/repos/" + encodeURIComponent(NET.conn.owner) + "/" + encodeURIComponent(NET.conn.repo) + "/contents/" + p;
const hdr = x => Object.assign({ "Authorization": "Bearer " + NET.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRemote(path){
  const mine = path === DATA_PATH, r = await fetch(api(path) + "?ref=" + encodeURIComponent(NET.conn.branch || "main") + "&t=" + now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) { if (mine) NET.sha = null; return null; }
  if (!r.ok) throw new Error("読み込み " + r.status);
  const j = await r.json(); if (mine) NET.sha = j.sha;
  let txt = j.content ? b64d(j.content) : null; if (!txt && j.download_url) { const r2 = await fetch(j.download_url, { cache: "no-store" }); txt = await r2.text(); }
  return txt ? JSON.parse(txt) : null;
}
async function pull(){
  if (!NET.conn || !NET.conn.token) return; NET.busy = true; updSaved();
  try { const remote = await fetchRemote(DATA_PATH), before = JSON.stringify(D); D = merge(D, remote);
    if (!D.settings.imp) { try { takeOld(await fetchRemote(OLD_PATH)); } catch (e) {} D.settings.imp = true; touch(D.settings); }
    saveLocal(); NET.state = ""; const changed = JSON.stringify(D) !== before; if (!remote || JSON.stringify(remote) !== JSON.stringify(D)) NET.dirty = true; NET.busy = false;
    if (changed && !U.sheet && document.activeElement !== $("#sk-in")) render(); else updSaved(); if (NET.dirty) queuePush(300);
  } catch (e) { NET.busy = false; NET.state = "err"; updSaved(); console.warn(e); }
}
function queuePush(ms){ NET.dirty = true; updSaved(); clearTimeout(NET.timer); NET.timer = setTimeout(push, ms == null ? 1500 : ms); }
async function push(){
  if (!NET.conn || !NET.conn.token || !NET.dirty) { updSaved(); return; } if (NET.busy) { queuePush(800); return; } NET.busy = true;
  try { for (let i = 0; i < 3; i++) { const body = { message: "史記を更新", content: b64e(JSON.stringify(D)), branch: NET.conn.branch || "main" }; if (NET.sha) body.sha = NET.sha;
      const r = await fetch(api(DATA_PATH), { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
      if (r.ok) { const j = await r.json(); NET.sha = j.content && j.content.sha; NET.dirty = false; NET.state = ""; break; }
      if (r.status === 409 || r.status === 422) { D = merge(D, await fetchRemote(DATA_PATH)); saveLocal(); continue; } throw new Error("保存 " + r.status); }
  } catch (e) { NET.state = "err"; console.warn(e); }
  NET.busy = false; updSaved();
}
function findConn(){
  const keys = ["sho-conn", "hyogikai-conn", "kenseiin-conn"]; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/conn/i.test(k) && !keys.includes(k)) keys.push(k); } } catch (e) {}
  for (const k of keys) { const c = lsGet(k, null); if (c && typeof c === "object" && c.token && c.owner) return { owner: c.owner, repo: (k === "sho-conn" && c.repo) || "notion-daily", branch: c.branch || "main", token: c.token }; }
  return null;
}
NET.conn = findConn();
render();
if (NET.conn) pull();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (!NET.conn) NET.conn = findConn(); if (NET.conn) pull(); } else if (NET.dirty) push(); });
window.SK = { get D(){ return D; }, U, render, newsList };
