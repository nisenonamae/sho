<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>史記</title>
<meta name="theme-color" content="#22201C">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#22201C;--paper:#F6F3EC;--white:#FFFDF8;--sheet:#F1EDE4;--rule:#DDD6C8;--sub:#7A7266;--faint:#ADA597}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid #2F4F8A;outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:0 16px calc(1.2rem + env(safe-area-inset-bottom))}
.hd{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem 0 .5rem;border-bottom:2px solid var(--ink);margin-bottom:.5rem}
.hd h1{margin:0;font-size:1.3rem;letter-spacing:.14em;font-weight:900}
.tabs{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:none;padding:.32rem .7rem;font-size:.8rem;font-weight:800;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.note{font-size:.72rem;color:var(--sub);line-height:1.6}.foot{display:flex;justify-content:space-between;font-size:.66rem;color:var(--sub);margin:1rem 2px 0}.saved.err{color:#B8432F}
.links{display:flex;justify-content:space-between;gap:1rem}.links button{border:0;background:none;padding:0;font-size:.78rem;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.bigbtn{display:block;width:100%;border:0;border-radius:14px;background:var(--bc,var(--ink));color:#fff;font-weight:800;font-size:.95rem;padding:.75rem;margin-top:.9rem;cursor:pointer}.bigbtn small{display:block;font-weight:400;font-size:.68rem;opacity:.85}
.fi{display:block;width:100%;border:1.5px solid var(--rule);border-radius:12px;background:var(--white);padding:.6rem .7rem;font-size:.95rem;line-height:1.6}
.nwl{font-size:.68rem;font-weight:800;color:var(--sub);margin:.75rem 0 .3rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}.chip{border:1.5px solid var(--rule);border-radius:999px;background:var(--white);padding:.35rem .85rem;font-size:.84rem;font-weight:700;cursor:pointer}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dim{position:fixed;inset:0;background:rgba(34,32,28,.45);z-index:20}
.bs{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:20px 20px 0 0;padding:.5rem 16px calc(1rem + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;max-width:760px;margin:0 auto}
.bs .grab{width:2.6rem;height:.28rem;border-radius:999px;background:var(--rule);margin:.2rem auto .7rem}.bs h3{margin:0 0 .4rem;font-size:1.1rem}.bs .d{margin:0 0 .5rem;font-size:.78rem;color:var(--sub)}
#toast{position:fixed;left:50%;top:4.2rem;transform:translate(-50%,-400%);background:var(--ink);color:#fff;border-radius:999px;padding:.5rem 1.1rem;font-size:.84rem;z-index:40;transition:transform .2s;white-space:nowrap}#toast.on{transform:translate(-50%,0)}
.nzm{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}.nzm button{border:0;background:none;padding:.25rem .8rem;font-size:.76rem;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}.nzm button.on{background:var(--ink);color:#fff}
.npk{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:.45rem .7rem;font-size:.8rem;margin-bottom:.4rem}.npk button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:7px;padding:.15rem .6rem;font-size:.72rem;font-family:inherit}
.ntl{overflow-x:auto;background:#FBF9F3;border:1px solid var(--rule);border-radius:10px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ntl .nin{width:max-content;min-width:100%}
.ntl .nln{flex:0 0 2.9rem;width:2.9rem;position:sticky;left:0;z-index:2;background:#FBF9F3;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:900;color:var(--lc);border-right:2px solid var(--lc,var(--rule))}
.ntl .nera{display:flex;height:1.55rem}.ntl .nera .nln{border-right-color:transparent}
.ntl .nera>span{flex:none;border-bottom:1.5px dashed var(--rule)}
.ntl .nera>button.on{flex:none;border:0;color:#fff;font-weight:900;font-size:.68rem;font-family:inherit;text-align:left;padding:0 .5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ntl .nhd{display:flex;background:var(--sheet);border-bottom:1px solid var(--rule)}.ntl .nhd .nln{background:var(--sheet);border-right-color:transparent}
.ntl .nhd button{flex:0 0 var(--cw);width:var(--cw);border:0;border-right:1px dashed var(--rule);background:none;text-align:left;padding:.15rem .35rem;font-size:.66rem;color:var(--sub);font-family:inherit;cursor:pointer;white-space:nowrap}
.ntl .nhd button small{font-size:.58rem;margin-left:.2rem}.ntl .nhd button.t{background:#fff;color:var(--ink);font-weight:800}.ntl .nhd button.pk{background:var(--ink);color:#fff}
.ntl .nlane{display:flex;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--lc) 6%,#FBF9F3)}.ntl .nlane:last-child{border-bottom:0}
.ntl .ncell{flex:0 0 var(--cw);width:var(--cw);min-height:5.6rem;border:0;border-right:1px dashed var(--rule);background:none;padding:.3rem;text-align:left;font-family:inherit;color:var(--ink);display:block}
.ntl button.ncell{cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}.ntl button.ncell:disabled{cursor:default}
.ntl .nbig{display:block;width:100%;border:0;padding:0;background:var(--lc);border-radius:8px;overflow:hidden;margin-bottom:.25rem;font-family:inherit;text-align:left;cursor:pointer}
.ntl .nbig span{display:flex;height:2.3rem;align-items:center;justify-content:center;font-size:1.35rem;background:color-mix(in srgb,var(--lc) 25%,#fff)}
.ntl .nbig b{display:block;color:#fff;font-size:.64rem;line-height:1.35;padding:.15rem .35rem .22rem;font-weight:800;overflow-wrap:anywhere}
.ntl.zw .nbig b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntl .nch{display:block;width:100%;background:#fff;border:1.5px solid var(--lc);border-radius:7px;font-size:.62rem;line-height:1.35;padding:.2rem .3rem;font-weight:700;margin-bottom:.2rem;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.ntl .nmo{font-size:.58rem;color:var(--sub)}
.ntl .ntiles{display:flex;flex-wrap:wrap;gap:3px}.ntl .ntiles i{font-style:normal;width:1.5rem;height:1.5rem;border-radius:6px;background:#fff;border:1.5px solid var(--lc);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.ntl.zm .ncell{display:flex;flex-direction:column;justify-content:flex-end;padding:.25rem .3rem 0}
.ntl .nflags{display:flex;gap:2px;justify-content:center;margin-bottom:3px}.ntl .nflags em{font-style:normal;font-size:.72rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;border:1.5px solid var(--lc);display:flex;align-items:center;justify-content:center}
.ntl .nsky{display:flex;gap:2px;align-items:flex-end;height:2.9rem;border-bottom:3px solid var(--lc)}.ntl .nsky .c{flex:1;display:flex;flex-direction:column-reverse;gap:1px}.ntl .nsky u{display:block;height:6px;background:var(--lc);opacity:.8;border-radius:1px}
.nemo{display:flex;flex-wrap:wrap;gap:.3rem}.nemo button{width:2.2rem;height:2.2rem;border:1.5px solid var(--rule);border-radius:9px;background:var(--white);font-size:1.1rem;cursor:pointer}.nemo button.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.nld{font-size:.68rem;font-weight:800;color:var(--sub);margin:.7rem 0 .2rem}
.nli{display:flex;gap:.55rem;align-items:flex-start;width:100%;border:0;border-top:1px dashed var(--rule);background:none;padding:.45rem 0;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.nli span{flex:none;width:1.9rem;height:1.9rem;border-radius:7px;background:color-mix(in srgb,var(--lc) 20%,#fff);display:flex;align-items:center;justify-content:center;font-size:1rem}
.nli b{flex:1;font-size:.84rem;line-height:1.6;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere}.nli b.tp{font-weight:800}

.nmh{align-items:center}.nlead{font-size:.7rem;color:var(--sub);margin:.1rem 2px .4rem}
.nbar{display:flex;justify-content:space-between;align-items:center;margin:.2rem 0 .5rem}
.nhb{border:1.5px solid #8A5A9A;border-radius:9px;background:none;color:#8A5A9A;font-size:.72rem;font-weight:800;padding:.25rem .65rem;font-family:inherit;cursor:pointer}.nhb.on{background:#8A5A9A;color:#fff}
.nst{display:flex;flex-direction:column;gap:.4rem;min-height:45vh;justify-content:flex-end;padding-bottom:.6rem}
.nsd{align-self:center;font-size:.64rem;background:rgba(34,32,28,.12);border-radius:999px;padding:.1rem .75rem;font-weight:700;margin:.4rem 0 .1rem}
.nsm{align-self:center;border:1.5px dashed var(--rule);background:none;border-radius:999px;padding:.3rem .9rem;font-size:.7rem;color:var(--sub);font-family:inherit;cursor:pointer}
.nsb{max-width:82%;border:0;text-align:left;font-family:inherit;padding:.45rem .7rem;border-radius:14px;font-size:.88rem;line-height:1.6;cursor:pointer;color:var(--ink)}
.nsb span{display:block;white-space:pre-wrap;overflow-wrap:anywhere}.nsb small{display:block;font-size:.58rem;opacity:.7;margin-top:.1rem}
.nsb i{display:block;font-style:normal;font-size:.6rem;font-weight:800}
.nsb.kw{align-self:flex-start;background:#fff;border:1.5px solid #2F4F8A;border-bottom-left-radius:4px}.nsb.kw i{color:#2F4F8A}
.nsb.ka{align-self:flex-end;background:#3F7A55;color:#fff;border-bottom-right-radius:4px}.nsb.ka i{color:#fff;opacity:.85}
.nsb.kh{align-self:flex-end;background:#F3EAF6;border:1.5px dashed #8A5A9A;border-radius:16px;color:#3E2A49}
.ninp{position:sticky;bottom:var(--navh,0px);z-index:5;background:var(--paper);margin:0 -16px;padding:.5rem 16px .6rem;border-top:1px solid var(--rule)}
.ninp .r{display:flex;gap:.4rem}.ninp textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--ink);border-radius:12px;padding:.5rem .7rem;font-size:.95rem;line-height:1.5;background:#fff;color:var(--ink);font-family:inherit}
.ninp .mic{flex:none;width:2.7rem;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);font-size:.78rem;font-weight:800;color:var(--ink);font-family:inherit;cursor:pointer}.ninp .mic.on{background:var(--ink);color:#fff}
.ninp .snd{display:flex;gap:.4rem;margin-top:.45rem}.ninp .snd button{flex:1;border:0;border-radius:11px;padding:.6rem 0;font-size:.86rem;font-weight:900;color:#fff;background:var(--lc);font-family:inherit;cursor:pointer}
.ntl .nlane.kh .nch{border-style:dashed;border-radius:12px;background:#F3EAF6}
.nmh{position:sticky;top:0;z-index:6;background:var(--paper);padding:.35rem 0;margin-bottom:.2rem;display:flex;justify-content:space-between;flex-wrap:nowrap}.nmh h2{margin:0}
.ninp{bottom:0;padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}
.nbar{gap:.6rem}.nhb{flex:none}
</style>
</head>
<body>
<div id="app"></div><div id="sheet"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* 史記 — 毎日の情勢(出来事・行動)と主観(心の中)を記し、年表で眺める */
const VER = "s1.01";
const DATA_PATH = "roadmap/apps/shiki/data.json", OLD_PATH = "roadmap/apps/hyogikai/data.json";
const K_DATA = "shiki-data", K_UI = "shiki-ui";
const $ = (q, r) => (r || document).querySelector(q);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const md = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
const mdS = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate(); };
const ymdJ = s => { const d = new Date(s + "T00:00:00"); return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; };
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const cut = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const now = () => Date.now();
const rid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const hsh = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };

// 種類:出来事(まわりで起きた)・行動(自分がした)= 情勢。心の中 = 主観
const NKIND = [{ id: "w", n: "出来事", c: "#2F4F8A", land: "#E6E9EE", place: "世の中" }, { id: "a", n: "行動", c: "#3F7A55", land: "#E4EBDD", place: "自分の国" }, { id: "h", n: "心の中", c: "#8A5A9A", land: "#EFE6F1", place: "心の島" }];
const EMO_KW = [["評議会", "🏛️"], ["憲法", "📜"], ["報道", "📰"], ["史記", "📰"], ["年表", "📰"], ["国力", "🧭"], ["大計", "🗺️"], ["行軍表", "🗺️"], ["通知", "🔔"], ["アプリ", "📱"], ["決め", "⚖️"],
  ["青チャート", "📐"], ["数学", "📐"], ["計算", "🧮"], ["リスニング", "🎧"], ["英作文", "✏️"], ["単語", "🔤"], ["英語", "📘"], ["Anki", "🗂"], ["授業", "🏫"], ["模試", "📝"], ["試験", "📝"],
  ["本屋", "📚"], ["映画", "🎬"], ["勝", "🏆"], ["雨", "☔"], ["散歩", "🚶"], ["バイト", "💼"], ["電車", "🚃"], ["風呂", "♨️"], ["寝", "🛌"], ["家族", "🏠"], ["買", "🛍"], ["旅", "🧳"], ["食", "🍚"], ["本", "📚"]];
const EMO_DEF = { w: ["🌤️", "📣", "🏠", "🗞️"], a: ["✏️", "🧭", "🔧", "📘"], h: ["💭", "🌙", "🌱", "⚡"] };
const EMO_PICK = ["🏛️", "⚖️", "📜", "📰", "🧭", "🗺️", "🔔", "📱", "📐", "🧮", "📘", "✏️", "🎧", "🔤", "🗂", "🏫", "📝", "📚", "🎬", "🏆", "☔", "🚶", "💼", "🚃", "♨️", "🛌", "🏠", "🛍", "🧳", "🍚", "☕️", "🌤️", "🎉", "⚡", "🌱", "🔥", "💭", "🌙"];
const ERA_COL = ["#6B4C9A", "#3F7A55", "#B8432F", "#2F4F8A", "#A9761C", "#7D4A8C"];

function normalize(d){ d = d && typeof d === "object" ? d : {}; ["news", "eras"].forEach(k => { if (!d[k] || typeof d[k] !== "object") d[k] = {}; }); d.settings = Object.assign({ u: 0, imp: false }, d.settings || {}); return d; }
let D = normalize(lsGet(K_DATA, null));
const U = Object.assign({ tab: "j", z: "d", nh: false }, lsGet(K_UI, {}), { sheet: null, arg: null, nq: { x: "" }, lim: 80, bottom: true });
const NET = { conn: null, sha: null, state: "", dirty: false, timer: null, busy: false };
const touch = o => { if (o) o.u = now(); return o; };
function saveLocal(){ lsSet(K_DATA, D); }
function saveUI(){ lsSet(K_UI, { tab: U.tab, z: U.z, nh: U.nh }); }
function mut(fn){ fn(); saveLocal(); saveUI(); queuePush(); render(); }
function quiet(fn){ fn(); saveLocal(); queuePush(); }
// 省アプリの中の「報道」で記したものを、いちどだけ引きつぐ
function takeOld(old){ if (!old) return 0; let n = 0; Object.values(old.news || {}).forEach(x => { if (!x || !x.id || !String(x.x || "").trim()) return; const y = D.news[x.id]; if (!y || (x.u || 0) > (y.u || 0)) { D.news[x.id] = { id: x.id, x: x.x, t: x.t, at: x.at, day: x.day, u: x.u || now(), e: x.e, top: x.top, auto: x.auto, del: x.del }; n++; } });
  Object.values(old.eras || {}).forEach(e => { if (e && e.id && !D.eras[e.id]) { D.eras[e.id] = e; n++; } }); return n; }
if (!lsGet("shiki-impL", false)) { takeOld(lsGet("hyogikai-data", null)); lsSet("shiki-impL", true); saveLocal(); }

const kindOf = x => NKIND.some(k => k.id === x.t) ? x.t : "a";
const kInfo = id => NKIND.find(l => l.id === id) || NKIND[1];
const newsList = () => Object.values(D.news).filter(x => !x.del).sort((a, b) => a.day < b.day ? -1 : a.day > b.day ? 1 : a.at - b.at);
const eraList = () => Object.values(D.eras).filter(e => !e.del).sort((a, b) => a.from < b.from ? -1 : 1);
function emoGuess(x){ const t = String(x.x || ""), hit = EMO_KW.find(([w]) => t.includes(w)); if (hit) return hit[1]; const d = EMO_DEF[kindOf(x)]; return d[hsh(x.id) % d.length]; }
const emoOf = x => x.e || emoGuess(x);
const nTitle = (x, n) => cut(String(x.x || "").split("\n")[0] || "(字なし)", n || 30);
function newsAdd(o){ const n = Object.assign({ id: rid(), x: "", t: "a", at: now(), day: today(), u: now() }, o); D.news[n.id] = n; return n; }
// その日の一面:自分で選んだもの、なければ情勢の中でいちばん長く書いたもの
function nTops(list){ const by = {}; list.filter(x => x.top || kindOf(x) !== "h").forEach(x => { (by[x.day] = by[x.day] || []).push(x); }); const tops = {}; Object.entries(by).forEach(([d, xs]) => { const f = xs.filter(x => x.top).sort((a, b) => (b.u || 0) - (a.u || 0))[0]; tops[d] = (f || xs.slice().sort((a, b) => (a.auto ? 1 : 0) - (b.auto ? 1 : 0) || (b.x || "").length - (a.x || "").length)[0]).id; }); return tops; }
const lanes = () => NKIND.filter(k => k.id !== "h" || U.nh);

/* ───────── 流れ ───────── */
function viewStream(all){
  const tab = U.tab, list = all.filter(x => (kindOf(x) === "h") === (tab === "s")), lim = U.lim, xs = list.slice(-lim); let h = "", day = "";
  xs.forEach(x => { if (x.day !== day) { day = x.day; h += '<div class="nsd">' + md(day) + "</div>"; } const k = kindOf(x);
    h += '<button class="nsb k' + k + '" data-ha="edit" data-hv="' + x.id + '">' + (tab === "j" ? "<i>" + kInfo(k).n + "</i>" : "") + "<span>" + esc(x.x || "(字なし)") + "</span><small>" + (x.auto ? "自動・" : "") + hm(x.at) + "</small></button>"; });
  const mic = window.SpeechRecognition || window.webkitSpeechRecognition ? '<button class="mic' + (U.mic ? " on" : "") + '" data-ha="mic" aria-label="声で入れる">' + (U.mic ? "…" : "声") + "</button>" : "";
  return '<p class="nlead">' + (tab === "j" ? "情勢:起きたことと、したこと。外から見えること。" : "主観:自分の心の中。情勢とは分けて残る。") + '</p><div class="nst">' +
    (list.length > lim ? '<button class="nsm" data-ha="more">もっと前を見る(あと ' + (list.length - lim) + " 件)</button>" : "") +
    (h || '<p class="note" style="text-align:center;margin:2rem 0">' + (tab === "j" ? "まわりで起きたこと・自分がしたことを、下から書く。" : "思ったこと・感じたことを、下から書く。") + "</p>") + "</div>" +
    '<div class="ninp"><div class="r"><textarea id="sk-in" data-hin="in" rows="2" placeholder="書く">' + esc(U.nq.x || "") + "</textarea>" + mic + "</div>" +
    '<div class="snd">' + NKIND.map(k => '<button style="--lc:' + k.c + '" data-ha="post" data-hv="' + k.id + '">' + k.n + "</button>").join("") + "</div></div>";
}

/* ───────── 年表 ───────── */
const monOf = d => { const dt = new Date(d + "T00:00:00"); return addDays(d, -((dt.getDay() + 6) % 7)); };
function nCols(list, z){ const td = today(), first = list.length ? list[0].day : td, cols = [];
  if (z === "d") { Array.from(new Set(list.map(x => x.day).concat([td]))).sort().forEach(d => cols.push({ from: d, to: d, lb: mdS(d), sb: WD[new Date(d + "T00:00:00").getDay()], now: d === td })); }
  else if (z === "w") { for (let w = monOf(first), end = monOf(td), i = 0; w <= end && i < 800; w = addDays(w, 7), i++) cols.push({ from: w, to: addDays(w, 6), lb: mdS(w), sb: "の週", now: w === end }); }
  else { let y = +first.slice(0, 4), mo = +first.slice(5, 7); const ey = +td.slice(0, 4), em = +td.slice(5, 7); for (let i = 0; (y < ey || (y === ey && mo <= em)) && i < 800; i++) { cols.push({ from: y + "-" + pad(mo) + "-01", to: ymd(new Date(y, mo, 0)), lb: mo + "月", sb: (mo === 1 || !i) ? String(y) : "", now: y === ey && mo === em }); if (++mo > 12) { mo = 1; y++; } } }
  return cols; }
function nCell(xs, z, tops){
  if (!xs.length) return "";
  const tp = xs.filter(x => tops[x.day] === x.id), rest = xs.filter(x => tops[x.day] !== x.id);
  if (z === "d") return tp.map(x => '<button class="nbig" data-ha="edit" data-hv="' + x.id + '"><span>' + emoOf(x) + "</span><b>" + esc(nTitle(x, 24)) + "</b></button>").join("") +
    rest.slice(0, 5).map(x => '<button class="nch" data-ha="edit" data-hv="' + x.id + '">' + esc(nTitle(x, 22)) + "</button>").join("") + (rest.length > 5 ? '<div class="nmo">ほか ' + (rest.length - 5) + "</div>" : "");
  if (z === "w") { const hd = tp.slice().sort((a, b) => (b.top ? 1 : 0) - (a.top ? 1 : 0) || (b.x || "").length - (a.x || "").length)[0], others = xs.filter(x => x !== hd);
    return (hd ? '<div class="nbig"><span>' + emoOf(hd) + "</span><b>" + esc(nTitle(hd, 14)) + "</b></div>" : "") + '<div class="ntiles">' + others.slice(0, 15).map(x => "<i>" + emoOf(x) + "</i>").join("") + "</div>" + (others.length > 15 ? '<div class="nmo">ほか ' + (others.length - 15) + "</div>" : ""); }
  const unit = Math.ceil(xs.length / 36), n = Math.ceil(xs.length / unit), cn = 6, hs = Array.from({ length: cn }, (_, i) => Math.floor(n / cn) + (i < n % cn ? 1 : 0));
  return '<div class="nflags">' + tp.slice(-3).map(x => "<em>" + emoOf(x) + "</em>").join("") + '</div><div class="nsky">' + hs.map((h, i) => '<div class="c">' + "<u></u>".repeat(hs[(i * 5 + 2) % cn]) + "</div>").join("") + "</div>";
}
function viewChron(all){
  const z = U.z, shown = all.filter(x => U.nh || kindOf(x) !== "h"), tops = nTops(all), cols = nCols(shown, z), cw = z === "d" ? 116 : z === "w" ? 124 : 76, pk = U.era;
  const eras = eraList(); let band = "", run = null;
  const flush = () => { if (!run) return; band += run.e ? '<button class="on" style="width:' + (run.n * cw) + "px;background:" + (run.e.c || ERA_COL[0]) + '" data-ha="eraopen" data-hv="' + run.e.id + '">' + esc(run.e.n) + "</button>" : '<span style="width:' + (run.n * cw) + 'px"></span>'; run = null; };
  cols.forEach(c => { const e = eras.find(e => e.from <= c.to && e.to >= c.from) || null; if (run && run.e === e) run.n++; else { flush(); run = { e, n: 1 }; } }); flush();
  const tl = '<div class="ntl z' + z + '" id="sk-tl" data-z="' + z + '" style="--cw:' + cw + 'px"><div class="nin"><div class="nera"><div class="nln"></div>' + band + '</div><div class="nhd"><div class="nln"></div>' +
    cols.map(c => '<button class="' + (c.now ? "t" : "") + (pk && pk.from === c.from ? " pk" : "") + '" data-ha="col" data-hv="' + c.from + "|" + c.to + '">' + c.lb + "<small>" + c.sb + "</small></button>").join("") + "</div>" +
    lanes().map(l => { const mine = shown.filter(x => kindOf(x) === l.id); return '<div class="nlane k' + l.id + '" style="--lc:' + l.c + '"><div class="nln">' + l.n + "</div>" + cols.map(c => { const xs = mine.filter(x => x.day >= c.from && x.day <= c.to); return z === "d" ? '<div class="ncell">' + nCell(xs, z, tops) + "</div>" : '<button class="ncell" data-ha="list" data-hv="' + c.from + "|" + c.to + "|" + l.id + '"' + (xs.length ? "" : " disabled") + ">" + nCell(xs, z, tops) + "</button>"; }).join("") + "</div>"; }).join("") + "</div></div>";
  return '<div class="nbar"><div class="nzm">' + [["d", "日"], ["w", "週"], ["m", "月"]].map(([k, n]) => '<button class="' + (z === k ? "on" : "") + '" data-ha="z" data-hv="' + k + '">' + n + '</button>').join("") + '</div><button class="nhb' + (U.nh ? " on" : "") + '" data-ha="nh">' + (U.nh ? "主観を重ねている" : "主観も重ねる") + "</button></div>" +
    (pk ? '<div class="npk"><b>' + (pk.from ? "終わりの列の日付を押す" : "始まりの列の日付を押す") + '</b><button data-ha="eracancel">やめる</button></div>' : "") +
    (shown.length ? tl + '<div class="links" style="margin-top:.6rem"><button data-ha="erastart">過去をふり返って、時代の名前を付ける</button><span></span></div>' : '<p class="note" style="margin:.3rem 2px 0">記すと、ここに年表ができていく。</p>');
}

/* ───────── 下から出る紙 ───────── */
const sheetWrap = inner => '<div class="dim" data-ha="close"></div><div class="bs" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + "</div>";
function sheetEdit(){
  const x = D.news[(U.arg || {}).id]; if (!x) return ""; const l = kindOf(x), isTop = nTops(newsList())[x.day] === x.id, cur = emoOf(x);
  return sheetWrap('<h3>記したものを直す</h3><textarea class="fi" rows="4" data-hin="ex" data-hv="' + x.id + '" placeholder="書く">' + esc(x.x || "") + "</textarea>" +
    '<div class="nwl">種類(出来事・行動=情勢、心の中=主観)</div><div class="chips">' + NKIND.map(n => '<button class="chip' + (l === n.id ? " on" : "") + '" data-ha="ek" data-hv="' + n.id + '">' + n.n + "</button>").join("") + "</div>" +
    '<div class="nwl">日付</div><input class="fi" type="date" data-hin="eday" data-hv="' + x.id + '" value="' + x.day + '" max="' + today() + '">' +
    '<div class="nwl">絵(自動。替えたいときだけ押す)</div><div class="nemo">' + Array.from(new Set([cur].concat(EMO_PICK))).map(e => '<button class="' + (e === cur ? "on" : "") + '" data-ha="ee" data-hv="' + e + '">' + e + "</button>").join("") + "</div>" +
    '<button class="bigbtn" style="--bc:' + (isTop ? "var(--sub)" : "var(--ink)") + ';margin-top:.8rem" data-ha="top" data-hv="' + x.id + '">' + (isTop ? "この日の一面になっている" : "この日の一面にする") + "<small>" + (isTop ? (x.top ? "もう一度押すと、自動の選び方に戻る" : "自動で選ばれた") : "年表で大きく残る") + "</small></button>" +
    '<div class="links" style="margin-top:.8rem"><button data-ha="del" data-hv="' + x.id + '">これを消す</button><span></span></div><button class="bigbtn" data-ha="close">これでいい</button>');
}
function sheetList(){
  const a = U.arg || {}, all = newsList(), tops = nTops(all), xs = all.filter(x => x.day >= a.from && x.day <= a.to && (a.l ? kindOf(x) === a.l : (U.nh || kindOf(x) !== "h"))), days = Array.from(new Set(xs.map(x => x.day)));
  return sheetWrap("<h3>" + (a.from === a.to ? md(a.from) : mdS(a.from) + "〜" + mdS(a.to)) + (a.l ? "・" + kInfo(a.l).n : "") + '</h3><p class="d">' + xs.length + " 件</p>" +
    (xs.length ? days.map(d => '<div class="nld">' + md(d) + "</div>" + xs.filter(x => x.day === d).map(x => '<button class="nli" style="--lc:' + kInfo(kindOf(x)).c + '" data-ha="edit" data-hv="' + x.id + '"><span>' + emoOf(x) + "</span><b" + (tops[d] === x.id ? ' class="tp"' : "") + ">" + esc(x.x || "(字なし)") + "</b></button>").join("")).join("") : '<p class="note">この間は何も記していない。</p>') + '<button class="bigbtn" data-ha="close">とじる</button>');
}
function sheetEra(){ const e = D.eras[(U.arg || {}).id]; if (!e) return ""; return sheetWrap("<h3>" + esc(e.n) + '</h3><p class="d">' + md(e.from) + " 〜 " + md(e.to) + '</p><div class="links"><button data-ha="erarename" data-hv="' + e.id + '">名前を変える</button><button data-ha="eradel" data-hv="' + e.id + '">この時代の区切りを消す</button></div><button class="bigbtn" data-ha="close">とじる</button>'); }

/* ───────── 描画 ───────── */
function savedLabel(){ if (!NET.conn) return '<span class="saved">✓ 手元に保存済み(省アプリでつなぐと、ほかの端末にも出る)</span>'; return '<span class="saved' + (NET.state === "err" ? " err" : "") + '">' + (NET.state === "err" ? "！ つながらない(手元には保存済み)" : NET.busy || NET.dirty ? "… 保存中" : "✓ 保存済み") + "</span>"; }
function updSaved(){ const el = $(".saved"); if (el) el.outerHTML = savedLabel(); }
function render(){
  const app = $("#app"), y = window.scrollY, ae = document.activeElement, aid = ae && ae.id, all = newsList();
  const tl0 = $("#sk-tl"), tls = tl0 ? { l: tl0.scrollLeft, z: tl0.dataset.z, end: tl0.scrollWidth - tl0.scrollLeft - tl0.clientWidth < 30 } : null;
  let sel = null; try { if (aid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  if (!["j", "s", "n"].includes(U.tab)) U.tab = "j"; const tab = U.tab;
  app.innerHTML = '<header class="hd"><h1>史記</h1><nav class="tabs">' + [["j", "情勢"], ["s", "主観"], ["n", "年表"]].map(([k, n]) => '<button class="' + (tab === k ? "on" : "") + '" data-ha="tab" data-hv="' + k + '">' + n + "</button>").join("") + "</nav></header>" +
    (tab === "n" ? viewChron(all) : viewStream(all)) + (tab === "n" ? '<p class="foot">' + savedLabel() + "<span>史記 " + VER + "</span></p>" : "");
  $("#sheet").innerHTML = U.sheet === "edit" ? sheetEdit() : U.sheet === "list" ? sheetList() : U.sheet === "era" ? sheetEra() : "";
  document.body.classList.toggle("lock", !!U.sheet);
  const tl = $("#sk-tl"); if (tl) { if (!tls || tls.z !== tl.dataset.z || tls.end) tl.scrollLeft = tl.scrollWidth; else tl.scrollLeft = tls.l; }
  if (U.bottom) { U.bottom = false; window.scrollTo(0, (tab === "j" || tab === "s") ? document.documentElement.scrollHeight : 0); }
  else if (U.keep) { window.scrollTo(0, y + document.documentElement.scrollHeight - U.keep); U.keep = 0; }
  else if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  if (aid) { const n = document.getElementById(aid); if (n && n !== ae) { n.focus({ preventScroll: true }); if (sel) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }

/* ───────── 操作 ───────── */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-ha]"); if (!b || b.disabled) return; const a = b.dataset.ha, v = b.dataset.hv;
  switch (a) {
    case "tab": U.tab = v; U.bottom = true; U.lim = 80; U.era = null; saveUI(); render(); return;
    case "post": { const x = (($("#sk-in") || {}).value || "").trim(); if (!x) { toast("字を書いてから押す"); const el = $("#sk-in"); el && el.focus(); return; }
      const t = NKIND.some(k => k.id === v) ? v : "a", here = (t === "h") === (U.tab === "s"); U.bottom = true;
      mut(() => { const n = newsAdd({ x, t }); U.fresh = n.id; U.nq = { x: "" }; }); toast(here ? "記した" : (t === "h" ? "主観に記した" : "情勢に記した")); return; }
    case "mic": { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR || U.mic) return; const r = new SR(); r.lang = "ja-JP"; r.interimResults = false; U.nq.x = ($("#sk-in") || {}).value || "";
      r.onresult = e => { U.nq.x = (U.nq.x ? U.nq.x + " " : "") + e.results[0][0].transcript; }; r.onend = () => { U.mic = false; render(); }; r.onerror = () => { U.mic = false; toast("声を聞き取れなかった"); render(); };
      U.mic = true; render(); try { r.start(); } catch (e) { U.mic = false; render(); } return; }
    case "more": U.lim += 150; U.keep = document.documentElement.scrollHeight; render(); return;
    case "edit": U.sheet = "edit"; U.arg = { id: v }; render(); return;
    case "close": U.sheet = null; render(); return;
    case "del": if (!confirm("これを消しますか。")) return; U.sheet = null; mut(() => { touch(Object.assign(D.news[v], { del: true })); }); return;
    case "ek": mut(() => { const x = D.news[U.arg.id]; x.t = v; touch(x); }); return;
    case "ee": mut(() => { const x = D.news[U.arg.id]; if (x.e === v) delete x.e; else x.e = v; touch(x); }); return;
    case "top": mut(() => { const x = D.news[v]; if (x.top) delete x.top; else { newsList().filter(y => y.day === x.day && y.top).forEach(y => { delete y.top; touch(y); }); x.top = true; } touch(x); }); return;
    case "nh": U.nh = !U.nh; saveUI(); render(); return;
    case "z": U.z = v; saveUI(); render(); return;
    case "list": { const [f, t, l] = v.split("|"); U.sheet = "list"; U.arg = { from: f, to: t, l: l || null }; render(); return; }
    case "col": { const [f, t] = v.split("|"), pk = U.era;
      if (!pk) { U.sheet = "list"; U.arg = { from: f, to: t, l: null }; render(); return; }
      if (!pk.from) { pk.from = f; pk.to0 = t; render(); return; }
      const from = pk.from < f ? pk.from : f, to = pk.to0 > t ? pk.to0 : t, n = (prompt("この時代の名前") || "").trim(); U.era = null; if (!n) { render(); return; }
      mut(() => { const id = rid(); D.eras[id] = { id, n, from, to, c: ERA_COL[eraList().length % ERA_COL.length], u: now() }; }); toast("時代を付けた"); return; }
    case "erastart": U.era = {}; render(); return;
    case "eracancel": U.era = null; render(); return;
    case "eraopen": U.sheet = "era"; U.arg = { id: v }; render(); return;
    case "erarename": { const e = D.eras[v], n = (prompt("時代の名前", e.n) || "").trim(); if (!n) return; mut(() => { e.n = n; touch(e); }); return; }
    case "eradel": if (!confirm("この時代の区切りを消しますか(記したものは消えない)。")) return; U.sheet = null; mut(() => { touch(Object.assign(D.eras[v], { del: true })); }); return;
  }
});
document.addEventListener("input", ev => { const t = ev.target, k = t.dataset && t.dataset.hin; if (!k) return;
  if (k === "in") { U.nq.x = t.value; return; }
  if (k === "ex") { quiet(() => { const x = D.news[t.dataset.hv]; if (x) { x.x = t.value; touch(x); } }); return; }
  if (k === "eday") { if (/^\d{4}-\d\d-\d\d$/.test(t.value) && t.value <= today()) quiet(() => { const x = D.news[t.dataset.hv]; if (x) { x.day = t.value; touch(x); } }); return; }
});

/* ───────── 同期(省アプリのトークンを借りる。新しいトークンは作らない) ───────── */
function merge(a, b){ if (!b) return a; const out = normalize(JSON.parse(JSON.stringify(a))); ["news", "eras"].forEach(k => { Object.entries(b[k] || {}).forEach(([id, x]) => { const y = out[k][id]; if (!y || (x.u || 0) > (y.u || 0)) out[k][id] = x; }); }); if ((b.settings && b.settings.u || 0) > (out.settings.u || 0)) out.settings = Object.assign({ u: 0, imp: false }, b.settings); return out; }
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const api = p => "https://api.github.com/repos/" + encodeURIComponent(NET.conn.owner) + "/" + encodeURIComponent(NET.conn.repo) + "/contents/" + p;
const hdr = x => Object.assign({ "Authorization": "Bearer " + NET.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRemote(path){
  const mine = path === DATA_PATH, r = await fetch(api(path) + "?ref=" + encodeURIComponent(NET.conn.branch || "main") + "&t=" + now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) { if (mine) NET.sha = null; return null; }
  if (!r.ok) throw new Error("読み込み " + r.status);
  const j = await r.json(); if (mine) NET.sha = j.sha;
  let txt = j.content ? b64d(j.content) : null; if (!txt && j.download_url) { const r2 = await fetch(j.download_url, { cache: "no-store" }); txt = await r2.text(); }
  return txt ? JSON.parse(txt) : null;
}
async function pull(){
  if (!NET.conn || !NET.conn.token) return; NET.busy = true; updSaved();
  try { const remote = await fetchRemote(DATA_PATH), before = JSON.stringify(D); D = merge(D, remote);
    if (!D.settings.imp) { try { takeOld(await fetchRemote(OLD_PATH)); } catch (e) {} D.settings.imp = true; touch(D.settings); }
    saveLocal(); NET.state = ""; const changed = JSON.stringify(D) !== before; if (!remote || JSON.stringify(remote) !== JSON.stringify(D)) NET.dirty = true; NET.busy = false;
    if (changed && !U.sheet && document.activeElement !== $("#sk-in")) render(); else updSaved(); if (NET.dirty) queuePush(300);
  } catch (e) { NET.busy = false; NET.state = "err"; updSaved(); console.warn(e); }
}
function queuePush(ms){ NET.dirty = true; updSaved(); clearTimeout(NET.timer); NET.timer = setTimeout(push, ms == null ? 1500 : ms); }
async function push(){
  if (!NET.conn || !NET.conn.token || !NET.dirty) { updSaved(); return; } if (NET.busy) { queuePush(800); return; } NET.busy = true;
  try { for (let i = 0; i < 3; i++) { const body = { message: "史記を更新", content: b64e(JSON.stringify(D)), branch: NET.conn.branch || "main" }; if (NET.sha) body.sha = NET.sha;
      const r = await fetch(api(DATA_PATH), { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
      if (r.ok) { const j = await r.json(); NET.sha = j.content && j.content.sha; NET.dirty = false; NET.state = ""; break; }
      if (r.status === 409 || r.status === 422) { D = merge(D, await fetchRemote(DATA_PATH)); saveLocal(); continue; } throw new Error("保存 " + r.status); }
  } catch (e) { NET.state = "err"; console.warn(e); }
  NET.busy = false; updSaved();
}
function findConn(){
  const keys = ["sho-conn", "hyogikai-conn", "kenseiin-conn"]; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/conn/i.test(k) && !keys.includes(k)) keys.push(k); } } catch (e) {}
  for (const k of keys) { const c = lsGet(k, null); if (c && typeof c === "object" && c.token && c.owner) return { owner: c.owner, repo: (k === "sho-conn" && c.repo) || "notion-daily", branch: c.branch || "main", token: c.token }; }
  return null;
}
NET.conn = findConn();
render();
if (NET.conn) pull();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (!NET.conn) NET.conn = findConn(); if (NET.conn) pull(); } else if (NET.dirty) push(); });
window.SK = { get D(){ return D; }, U, render, newsList };
</script>
