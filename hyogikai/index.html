<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22201C">
<title>最高評議会</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#22201C;--paper:#F6F3EC;--white:#FFFDF8;--sheet:#F1EDE4;--rule:#DDD6C8;--sub:#7A7266;--faint:#ADA597;
 --p1:#3F7A55;--p2:#2F4F8A;--p3:#A9761C;--p4:#6B4C9A;--p5:#22808A;--p6:#B8432F;--p7:#4A4540;--gold:#B8860B}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pc,var(--ink));outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:600px;margin:0 auto}
/* 上の帯 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);padding:.6rem 16px .7rem}
.top .r1{display:flex;align-items:center;justify-content:space-between;gap:.5rem}.top b{font-size:.95rem;letter-spacing:.1em}
.top .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;white-space:nowrap}.top .tm small{font-size:.65rem;font-weight:400;opacity:.7;margin-right:.3rem}
.steps{display:flex;gap:3px;margin-top:.5rem}.steps i{flex:1;height:6px;border-radius:3px;background:var(--c);opacity:.28}.steps i.d{opacity:.9}.steps i.c{opacity:1;box-shadow:0 0 0 1.5px var(--paper)}
.top .r2{display:flex;justify-content:space-between;align-items:center;gap:.4rem;margin-top:.45rem;font-size:.7rem}
.top .r2>span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .bt{display:flex;gap:.35rem;align-items:center;flex:none}
.pill{border:1px solid rgba(246,243,236,.4);border-radius:999px;padding:.2rem .65rem;background:none;color:var(--paper);font-size:.72rem}
.saved{font-size:.62rem;opacity:.7;margin-right:.1rem;white-space:nowrap}.saved.err{color:#F2A08F;opacity:1}
/* パーツの見出し */
.ptitle{padding:.95rem 16px .2rem;border-left:6px solid var(--pc);margin:0}.ptitle small{display:block;font-size:.72rem;color:var(--pc);font-weight:800;letter-spacing:.1em}.ptitle h2{margin:.1rem 0 0;font-size:1.35rem}.ptitle p{margin:.25rem 0 0;font-size:.8rem;color:var(--sub);line-height:1.6}
.body{padding:.7rem 16px 0}
/* 枠(見出しは枠の中) */
.card{background:var(--white);border:1px solid var(--rule);border-radius:12px;margin:0 0 .6rem;overflow:hidden}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:.55rem .8rem;background:var(--sheet);border-bottom:1px solid var(--rule)}
.ch b{font-size:.84rem;color:var(--pc);letter-spacing:.04em;flex:none}.ch span{font-size:.7rem;color:var(--sub);text-align:right}
.cb{padding:.65rem .8rem}
.ta{display:block;width:100%;border:0;background:transparent;resize:vertical;font-size:.88rem;line-height:1.7;padding:0;min-height:5rem}
.ta:focus{outline:none}.ta::placeholder,.inp input::placeholder,.inp textarea::placeholder,.fi::placeholder{color:var(--faint)}
.fi{display:block;width:100%;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:.55rem .7rem;font-size:.9rem;line-height:1.6}
textarea.fi{resize:vertical;min-height:4.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1.5px solid var(--rule);background:var(--white);border-radius:999px;padding:.32rem .75rem;font-size:.82rem;font-weight:600;color:var(--sub)}
.chip.on{background:var(--pc);border-color:var(--pc);color:var(--white)}.chip small{font-weight:400;font-size:.68rem;opacity:.8;margin-left:.3rem}
.chk{display:flex;gap:.65rem;align-items:center;padding:.65rem .8rem;border:0;border-top:1px solid var(--rule);width:100%;background:none;text-align:left}.chk:first-child{border-top:0}
.box{flex:none;width:1.4rem;height:1.4rem;border-radius:6px;border:2px solid var(--rule);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--white)}.box.on{background:var(--pc);border-color:var(--pc)}
.chk b{display:block;font-size:.9rem}.chk span.s{display:block;font-size:.72rem;color:var(--sub);margin-top:.1rem}
.dt{font-weight:800;font-size:1.05rem;line-height:1.5}.meta{font-size:.74rem;color:var(--sub);margin-top:.2rem;line-height:1.55}
.res{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.6rem}.res button{text-align:center;border:1.5px solid var(--rule);border-radius:10px;padding:.6rem 0;font-size:.84rem;font-weight:700;color:var(--sub);background:var(--white)}
.res .on{background:var(--rc,#3F7A55);border-color:var(--rc,#3F7A55);color:var(--white)}
.auto{font-size:.76rem;color:#3F7A55;margin-top:.5rem;line-height:1.55}.auto.w{color:var(--p6)}
.auto button{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;color:inherit;font-size:inherit}
.line{border-top:1px solid var(--rule);margin:.65rem -.8rem 0;padding:.6rem .8rem 0}
.lbl{font-size:.72rem;font-weight:700;color:var(--sub);margin-bottom:.3rem}
.item{display:flex;gap:.65rem;align-items:center;padding:.65rem .8rem;border-top:1px solid var(--rule)}.item:first-child{border-top:0}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:.9rem;line-height:1.45;font-weight:700}.item .m span{display:block;font-size:.72rem;color:var(--sub);margin-top:.1rem}
.item.pin{background:#FBF4E4}.w{color:var(--p6)!important}.cs{color:var(--p3)!important}
.min{flex:none;font-size:.8rem;font-weight:800;color:var(--pc);border:1.5px solid var(--pc);border-radius:8px;padding:.2rem .5rem;background:none}
.tapzone{display:flex;gap:.65rem;align-items:center;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.add{display:flex;gap:.4rem;padding:.5rem .8rem;border-top:1px solid var(--rule);font-size:.82rem;color:var(--sub);align-items:center}
.add input{flex:1;min-width:0;border:0;background:transparent;font-size:.86rem;padding:.25rem 0}.add input:focus{outline:none}
.add button,.mini{border:1.5px solid var(--rule);background:var(--white);border-radius:8px;padding:.25rem .6rem;font-size:.76rem;font-weight:700;color:var(--sub)}
.addbtn{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:.6rem .8rem;font-size:.82rem;color:var(--sub)}
.tabs{display:flex;gap:.35rem;margin-bottom:.6rem}.tabs button{flex:1;font-size:.76rem;font-weight:700;border-radius:9px;padding:.45rem .55rem;background:var(--sheet);color:var(--sub);line-height:1.35;border:0;text-align:left;min-width:0}
.tabs button.on{background:var(--white);color:var(--ink);box-shadow:0 0 0 1.5px var(--pc) inset}
.idea{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-top:1px solid var(--rule);font-size:.9rem;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}.idea:first-child{border-top:0}
.copy{display:flex;align-items:center;gap:.7rem;width:100%;background:var(--pc);color:var(--white);border:0;border-radius:10px;padding:.75rem .9rem;font-weight:800;text-align:left;font-size:.95rem}.copy small{display:block;font-weight:400;font-size:.7rem;opacity:.85;margin-top:.1rem}
.links{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;color:var(--sub);margin:.2rem 2px .6rem}.links button{border:0;background:none;padding:.2rem 0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.dec{position:relative;padding-right:2.6rem}.dec textarea{font-weight:800;font-size:1.05rem;line-height:1.65;min-height:3.4rem}
.seal{position:absolute;top:-.15rem;right:0;width:2.2rem;height:2.2rem;border-radius:50%;border:2.5px solid var(--pc);color:var(--pc);display:grid;place-items:center;font-size:.8rem;font-weight:800;transform:rotate(-10deg)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr)}.grid4 div{text-align:center;padding:.5rem 0;font-size:.68rem;color:var(--sub);border-left:1px solid var(--rule)}.grid4 div:first-child{border-left:0}.grid4 b{display:block;font-size:1.3rem;color:var(--ink)}
.out{display:flex;gap:.5rem;align-items:center;padding:.55rem .8rem;border-top:1px solid var(--rule);font-size:.84rem}.out:first-child{border-top:0}.out em{flex:1;font-style:normal;min-width:0}
.s3{display:flex;background:var(--sheet);border-radius:8px;padding:2px;gap:2px;flex:none}.s3 button{font-size:.66rem;font-weight:700;padding:.3rem .45rem;border-radius:6px;color:var(--sub);border:0;background:none}.s3 .on{background:var(--pc);color:var(--white)}
.dots{display:flex;gap:.4rem}.dots button{flex:1;text-align:center;padding:.45rem 0;border-radius:8px;border:1.5px solid var(--rule);font-weight:700;color:var(--sub);background:var(--white)}.dots .on{background:var(--pc);border-color:var(--pc);color:var(--white)}
.empty{font-size:.84rem;color:var(--sub);line-height:1.7;padding:.2rem 0}
/* 下 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none}
.dock .wrap{padding:.7rem 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(246,243,236,0),var(--paper) 22%);pointer-events:auto}
.foot{display:flex;gap:.5rem;align-items:stretch}
.memo{flex:none;border:1.5px dashed var(--gold);background:#F7EDCF;color:#7a5a00;border-radius:12px;padding:.55rem .7rem;font-size:.74rem;font-weight:700;line-height:1.25;text-align:center}
.next{flex:1;border:0;border-radius:12px;background:var(--nc);color:var(--white);text-align:center;padding:.8rem;font-weight:800;font-size:.95rem}.next small{display:block;font-weight:400;font-size:.66rem;opacity:.9;margin-top:.1rem}
.spacer{height:var(--sp,120px)}
/* シート */
.dim{position:fixed;inset:0;background:rgba(34,32,28,.45);z-index:40}
.bs{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;padding:.6rem 16px calc(18px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto .8rem}
.bs h3{margin:0;font-size:1.1rem}.bs p.d{margin:.25rem 0 .7rem;font-size:.76rem;color:var(--sub);line-height:1.55}
.bigbtn{display:block;width:100%;border:0;border-radius:12px;background:var(--bc,var(--ink));color:var(--white);padding:.85rem;font-weight:800;font-size:.95rem;margin-top:1rem;text-align:center}.bigbtn small{display:block;font-weight:400;font-size:.68rem;opacity:.9}
.pr{display:flex;align-items:center;gap:.55rem;padding:.55rem .7rem;border-top:1px solid var(--rule)}.pr:first-child{border-top:0}
.pr .cl{width:.75rem;height:2rem;border-radius:4px;background:var(--c);flex:none}.pr .m{flex:1;min-width:0}.pr .m b{display:block;font-size:.9rem;line-height:1.4}.pr .m span{display:block;font-size:.7rem;color:var(--sub)}
.pr.here{background:#F3EEF8}.pr.off .m,.pr.off .cl,.pr.off .av{opacity:.35}
.mv{display:flex;flex-direction:column;gap:2px;flex:none}.mv button{border:0;background:var(--sheet);border-radius:5px;width:1.6rem;height:1.05rem;font-size:.55rem;color:var(--sub);padding:0;line-height:1}
.mv button:disabled{opacity:.3}
.sw{width:42px;height:24px;border-radius:12px;background:var(--rule);position:relative;flex:none;border:0;padding:0}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--white);transition:left .15s}.sw.on{background:var(--ink)}.sw.on::after{left:21px}
.donechip{font-size:.7rem;color:var(--sub);border:0;background:none;padding:.3rem .2rem;flex:none}
.jump{font-size:.7rem;color:var(--pc);font-weight:700;border:1.5px solid var(--rule);background:var(--white);border-radius:999px;padding:.15rem .55rem;flex:none}
.presets{display:flex;gap:.35rem;margin-bottom:.6rem}.presets button{flex:1;text-align:center;font-size:.76rem;font-weight:700;border-radius:9px;padding:.45rem 0;border:1.5px solid var(--rule);background:var(--white);color:var(--sub)}.presets .on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* 議員と発言録 */
:root{--mc:#22808A}
.issue{display:flex;align-items:flex-start;gap:.5rem;background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--pc);border-radius:4px 10px 10px 4px;padding:.5rem .7rem;margin:0 0 .5rem}
.issue small{display:block;font-size:.66rem;color:var(--pc);font-weight:800}.issue b{display:block;font-size:.95rem;line-height:1.45}.issue .m{flex:1;min-width:0}.issue .tm2{font-size:.72rem;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}.issue .tm2.w{color:var(--p6);font-weight:700}
.tray{display:flex;align-items:center;gap:.35rem;overflow-x:auto;margin:0 0 .5rem;scrollbar-width:none}.tray::-webkit-scrollbar{display:none}.tray>span{font-size:.68rem;font-weight:800;color:var(--pc);flex:none}
.tray i{font-style:normal;font-size:.74rem;background:var(--white);border:1.5px solid var(--pc);color:var(--ink);border-radius:999px;padding:.2rem .55rem;white-space:nowrap}.tray i.ph{border-style:dashed;color:var(--sub)}
.log{background:var(--white);border:1px solid var(--rule);border-radius:12px;padding:.3rem .6rem .5rem;min-height:280px}
.log .ch{margin:-.3rem -.6rem .35rem}
.say{display:flex;gap:.5rem;padding:.4rem 0;width:100%;border:0;background:none;text-align:left}.say:focus-visible{outline:2px solid var(--c)}
.av{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--c);color:var(--white);display:grid;place-items:center;font-size:.78rem;font-weight:800}
.say .m{flex:1;min-width:0}.say .nm{font-size:.66rem;color:var(--c);font-weight:800}.say .tx{font-size:.86rem;line-height:1.55;margin-top:.05rem;white-space:pre-wrap;word-break:break-word}
.tg{display:inline-block;font-size:.62rem;font-weight:800;border-radius:5px;padding:.03rem .35rem;margin-top:.2rem;margin-right:.25rem;border:1px solid var(--rule);color:var(--sub)}
.tg.an{background:var(--p4);border-color:var(--p4);color:var(--white)}.tg.hn{background:var(--p6);border-color:var(--p6);color:var(--white)}.tg.gn{background:#5B6B7A;border-color:#5B6B7A;color:var(--white)}.tg.mn{background:var(--p3);border-color:var(--p3);color:var(--white)}
.note2{display:block;width:100%;text-align:left;border:0;background:#F7F4FA;margin:.5rem 0;padding:.45rem .7rem .45rem .75rem;border-left:3px solid var(--pc);border-radius:0 8px 8px 0;font-size:.92rem;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.nh{font-size:.64rem;font-weight:800;color:var(--pc);margin-bottom:.1rem;display:flex;justify-content:space-between}
.sum2{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.6rem .7rem;border:1.5px solid var(--pc);background:var(--white);border-radius:10px;font-size:.88rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.seats{display:flex;gap:.35rem;overflow-x:auto;white-space:nowrap;margin-bottom:.35rem;align-items:center;scrollbar-width:none;padding:2px}.seats::-webkit-scrollbar{display:none}
.seat{flex:none;display:flex;align-items:center;gap:.25rem;font-size:.7rem;white-space:nowrap;font-weight:700;color:var(--sub);background:var(--white);border:1.5px solid var(--rule);border-radius:999px;padding:.12rem .55rem .12rem .12rem}
.seat .av{width:1.4rem;height:1.4rem;font-size:.6rem}.seat.on{border-color:var(--c);color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.seat.sh .av{background:var(--white);color:var(--p4);border:1.5px solid var(--p4)}.seat.plus{padding:.2rem .55rem}
.inp{display:flex;gap:.4rem;align-items:center;background:var(--white);border:1.5px solid var(--c,var(--pc));border-radius:12px;padding:.35rem .4rem .35rem .7rem}
.inp input{flex:1;min-width:0;border:0;background:transparent;font-size:.88rem;padding:.3rem 0}.inp input:focus,.inp textarea:focus{outline:none}
.tgs{display:flex;gap:.2rem;flex:none}.tgs button{font-size:.62rem;font-weight:800;border:1px solid var(--rule);border-radius:5px;padding:.2rem .3rem;color:var(--sub);background:var(--white)}
.tgs button.on.an{background:var(--p4);border-color:var(--p4);color:var(--white)}.tgs button.on.hn{background:var(--p6);border-color:var(--p6);color:var(--white)}.tgs button.on.gn{background:#5B6B7A;border-color:#5B6B7A;color:var(--white)}.tgs button.on.mn{background:var(--p3);border-color:var(--p3);color:var(--white)}
.send{background:var(--c,var(--pc));color:var(--white);border:0;border-radius:8px;padding:.4rem .65rem;font-size:.78rem;font-weight:800;flex:none}
.inp.tall{flex-direction:column;align-items:stretch;padding:.5rem .5rem .45rem .7rem}.inp.tall textarea{border:0;background:transparent;min-height:4.6rem;line-height:1.6;font-size:.9rem;resize:none;padding:0}
.inp.tall .bot{display:flex;justify-content:space-between;align-items:center}
.cmpk{display:flex;gap:.3rem}.cmpk button{font-size:.68rem;font-weight:800;border:1px solid var(--rule);border-radius:6px;padding:.25rem .5rem;color:var(--sub);background:var(--white)}.cmpk .on{background:var(--p4);border-color:var(--p4);color:var(--white)}
.sumcard .it2{display:block;padding:.6rem .8rem;border-top:1px solid var(--rule)}.sumcard .it2:first-child{border-top:0}.sumcard small{display:block;font-size:.66rem;font-weight:800;color:var(--p4)}.sumcard p{margin:.15rem 0 0;font-size:.86rem;line-height:1.65;white-space:pre-wrap}
.ans .it2{display:flex;gap:.55rem;align-items:flex-start;padding:.6rem .8rem;border:0;border-top:1px solid var(--rule);width:100%;background:none;text-align:left}.ans .it2:first-child{border-top:0}.ans .it2 .m{flex:1}.ans .it2 b{display:block;font-size:.9rem;line-height:1.5}.ans .it2 small{font-size:.68rem;color:var(--sub)}
/* 休会と再開 */
.resume{background:var(--white);border:2px solid var(--p4);border-radius:14px;overflow:hidden;margin-bottom:.8rem}
.resume .rh{background:var(--p4);color:var(--white);padding:.5rem .8rem;display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;font-weight:800}.resume .rh span{font-weight:400;font-size:.7rem;opacity:.9}
.resume .rb{padding:.7rem .8rem}.resume .rb>b{display:block;font-size:1rem;line-height:1.5}
.minisegs{display:flex;gap:3px;margin:.55rem 0 .2rem}.minisegs i{flex:1;height:5px;border-radius:3px;background:var(--c);opacity:.25}.minisegs i.d{opacity:.85}.minisegs i.c{opacity:1;outline:2px solid var(--c);outline-offset:1px}
.rbtns{display:flex;gap:.45rem;margin-top:.7rem}.rbtns button{text-align:center;border-radius:10px;padding:.7rem 0;font-weight:800;font-size:.86rem;border:0}.rbtns .go2{flex:2;background:var(--p4);color:var(--white)}.rbtns .end2{flex:1;border:1.5px solid var(--rule);color:var(--sub);background:var(--white)}
.why{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-top:.45rem;font-size:.72rem;color:var(--sub)}.why i{font-style:normal;font-size:.66rem;font-weight:800;background:#F7EDCF;color:#7a5a00;border-radius:5px;padding:.05rem .4rem}
.recap{background:#F3EEF8;border:1px solid #DCCFEA;border-radius:12px;padding:.6rem .75rem;margin-bottom:.55rem}.recap .hh{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--p4)}.recap .hh button{border:0;background:none;color:inherit;font-weight:800;font-size:inherit;padding:0}.recap p{margin:.3rem 0 0;font-size:.82rem;line-height:1.6}
.divider{display:flex;align-items:center;gap:.5rem;margin:.5rem 0;font-size:.66rem;font-weight:800;color:var(--p4)}.divider::before,.divider::after{content:"";flex:1;border-top:1.5px dashed #CDB9E0}
.hl{background:#FBF7E6;border-radius:8px}
.reason{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.reason button{text-align:center;border:1.5px solid var(--rule);border-radius:10px;padding:.6rem 0;font-size:.82rem;font-weight:700;color:var(--sub);background:var(--white)}.reason .on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.note{font-size:.74rem;color:var(--sub);line-height:1.6;margin:.4rem 2px 0}
/* 開会(ホーム) */
.head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding:16px 0 .5rem}
.head h1{margin:0;font-size:1.25rem;letter-spacing:.18em}.head button{border:0;background:none;color:var(--sub);font-size:.78rem;padding:.2rem 0}
.hseal{display:flex;align-items:center;gap:.9rem;margin:1.2rem 0 1rem}

</style></head><body>
<main id="app"></main><div id="sheet"></div>
<script>
(() => {
"use strict";
const APP_VERSION = "h1.00";
const DATA_PATH = "roadmap/apps/hyogikai/data.json";
const K_DATA = "hyogikai-data", K_CONN = "hyogikai-conn", K_ALIVE = "hyogikai-alive", K_UI = "hyogikai-ui";

/* ───────── 小道具 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const WD = "日月火水木金土";
const md = s => { const d = new Date(s + "T00:00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
const hms = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };
const ms2 = ms => { const neg = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000); return (neg ? "-" : "") + Math.floor(s / 60) + ":" + pad(s % 60); };
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
const circ = n => CIRC[n - 1] || "(" + n + ")";
const cut = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const ago = t => { const m = Math.round((now() - t) / 60000); if (m < 1) return "いま"; if (m < 60) return m + "分"; const h = Math.round(m / 60); if (h < 48) return h + "時間"; return Math.round(h / 24) + "日"; };
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ───────── パーツと議員 ───────── */
const T = {
  place:   { n: "場づくり",   c: "#3F7A55", d: "ほかのことが気にならない場に整えてから始める。" },
  verify:  { n: "検証",       c: "#2F4F8A", d: "確かめる日が来た決定が、効いたかを確かめる。" },
  pick:    { n: "議題選び",   c: "#A9761C", d: "" },
  debate:  { n: "審議",       c: "#6B4C9A", d: "" },
  consult: { n: "Claude 相談", c: "#22808A", d: "発言録をそのまま渡して、議員として反論してもらう。" },
  resolve: { n: "議決",       c: "#B8432F", d: "審議ごとのまとめを見ながら、案から決める。" },
  close:   { n: "閉会",       c: "#4A4540", d: "今日のまとめ。気になったことを片付けて閉じる。" }
};
const PRESETS = {
  full:    { n: "本会議",   parts: ["place", "verify", "pick", "consult", "resolve", "close"] },
  short:   { n: "短い会",   parts: ["place", "verify", "close"] },
  consult: { n: "相談だけ", parts: ["place", "debate", "consult", "resolve", "close"] }
};
const PALETTE = ["#2F6FB0", "#9A5B2E", "#2E7D6B", "#C08A1E", "#5B6B7A", "#8A4C7A", "#3F7A55", "#B8432F", "#4A6FA5", "#6B6B2E"];
const CLAUDE = { id: "C", name: "Claude(参考人)", s: "C", c: "#22808A" };
const TAGS = [["問題", "mn"], ["原因", "gn"], ["案", "an"], ["反論", "hn"]];
const tagCls = g => (TAGS.find(t => t[0] === g) || [0, ""])[1];
const RESULTS = [["効いた", "#3F7A55"], ["少し効いた", "#6E8F3A"], ["効かなかった", "#B8432F"], ["守れなかった", "#8A5A3A"]];
const PAUSE_WHY = ["時間切れ", "気が散った", "予定が入った", "疲れた"];

function defaults(){
  return {
    v: 1, cur: null, curU: 0,
    settings: { u: 0, nextNo: 1, teirei: 5, maxPick: 2, boxOpen: 3,
      places: ["図書館", "自宅", "カフェ"], placeStats: {},
      prep: [{ id: "p1", x: "Freedom を入れた", s: "YouTube の動画と SNS を止める。音楽はそのまま" }, { id: "p2", x: "スマホを手の届かないところへ", s: "" }, { id: "p3", x: "飲み物とトイレ", s: "" }],
      members: [
        { id: "m1", name: "推進派", s: "推", d: "やってみよう、で前に進める", c: "#2F6FB0", on: true },
        { id: "m2", name: "慎重派", s: "慎", d: "前の失敗と危なさを先に考える", c: "#9A5B2E", on: true },
        { id: "m3", name: "未来の自分", s: "未", d: "1年後の自分ならどう思うか", c: "#2E7D6B", on: true },
        { id: "m4", name: "飽きる自分", s: "飽", d: "3日後に守れるかを突く", c: "#C08A1E", on: true },
        { id: "m5", name: "受験生の自分", s: "受", d: "受験に効くかで考える", c: "#5B6B7A", on: false }
      ] },
    agendas: {}, decisions: {}, sessions: {}, later: {}
  };
}
function normalize(d){
  const base = defaults();
  d = d && typeof d === "object" ? d : base;
  ["agendas", "decisions", "sessions", "later"].forEach(k => { if (!d[k] || typeof d[k] !== "object") d[k] = {}; });
  d.settings = Object.assign(base.settings, d.settings || {});
  if (!("cur" in d)) d.cur = null; if (!d.curU) d.curU = 0;
  return d;
}

/* ───────── 状態 ───────── */
let D = normalize(lsGet(K_DATA, null));
const U = Object.assign({ view: "home", sheet: null, arg: null, seat: "sh", smode: "shingi", tag: null, verifyIdx: 0, resTab: null, open: {}, editMem: null, recapOff: {}, len: "full", drafts: {}, nextArm: null }, lsGet(K_UI, {}));
U.sheet = null; U.arg = null; U.nextArm = null;
const NET = { conn: null, sha: null, state: "", dirty: false, timer: null, busy: false };
const touch = o => { if (o) o.u = now(); return o; };
const S = () => D.cur && D.sessions[D.cur] && !D.sessions[D.cur].del && !D.sessions[D.cur].closed ? D.sessions[D.cur] : null;
const members = () => D.settings.members.filter(m => !m.del);
const memberOf = id => id === "C" ? CLAUDE : (D.settings.members.find(m => m.id === id) || { id, name: "?", s: "?", c: "#888" });
const agendaList = () => Object.values(D.agendas).filter(a => !a.del);
const decisionList = () => Object.values(D.decisions).filter(x => !x.del);
const closedSessions = () => Object.values(D.sessions).filter(s => !s.del && s.closed).sort((a, b) => b.no - a.no || b.at - a.at);

function saveLocal(){ lsSet(K_DATA, D); }
function saveUI(){ lsSet(K_UI, { view: U.view, seat: U.seat, smode: U.smode, len: U.len, drafts: U.drafts, recapOff: U.recapOff }); }
function mut(fn, opt){
  fn();
  const s = S(); if (s) touch(s);
  saveLocal(); saveUI(); queuePush();
  if (!opt || opt.render !== false) render();
}

/* ───────── 会の時計 ───────── */
const partOf = (s, id) => s.parts.find(p => p.id === id);
const curPart = s => partOf(s, s.cur) || s.parts.find(p => p.on) || null;
const onParts = s => s.parts.filter(p => p.on);
function liveElapsed(s){ return s.elapsed + (s.run ? now() - s.since : 0); }
function debUsed(s, d){ const cp = curPart(s); return d.used + (s.run && cp && cp.d === d.id ? now() - s.since : 0); }
function flush(s){
  if (!s || !s.run) return; const t = now(), dt = Math.max(0, t - s.since);
  s.elapsed += dt; const cp = curPart(s); if (cp && cp.d && s.debates[cp.d]) s.debates[cp.d].used += dt; s.since = t;
}
function alive(){ try { localStorage.setItem(K_ALIVE, String(now())); } catch (e) {} }

/* ───────── 議題・決定の見方 ───────── */
function dueDecisions(){ const t = today(); return decisionList().filter(x => x.st === "active" && x.checkAt && x.checkAt <= t).sort((a, b) => a.checkAt < b.checkAt ? -1 : 1); }
function boxAgendas(){ return agendaList().filter(a => a.st === "box").sort((a, b) => a.at - b.at); }
function contAgendas(){ return agendaList().filter(a => a.st === "cont").sort((a, b) => a.at - b.at); }
function nextTeirei(from){ const d = new Date((from || today()) + "T00:00:00"); for (let i = 0; i < 8; i++) { if (d.getDay() === D.settings.teirei && i > 0) return ymd(d); d.setDate(d.getDate() + 1); } return ymd(d); }

/* ───────── 会を開く ───────── */
function mkPart(t, extra){ return Object.assign({ id: rid(), t, on: true, done: false }, extra || {}); }
function openSession(kind){
  const st = D.settings;
  const s = { id: rid(), no: st.nextNo, kind, at: now(), date: today(), elapsed: 0, run: true, since: now(), parts: [], cur: null,
    place: null, prep: {}, checks: {}, picks: {}, debates: {}, consult: { seat: null, ans: [], link: "", skip: false, paste: "" },
    res: {}, kini: [], focus: 0, pauses: [], recap: null, u: now() };
  PRESETS[kind].parts.forEach(t => { if (t === "debate") { const d = newDebate(s, { title: "", min: 25 }); s.parts.push(mkPart("debate", { d: d.id })); } else s.parts.push(mkPart(t)); });
  // 継続審議があれば、議題選びで最初から選んでおく
  if (kind === "full") contAgendas().slice(0, st.maxPick).forEach(a => pickAgenda(s, a.id, true));
  s.cur = s.parts[0].id;
  st.nextNo++; touch(st);
  D.sessions[s.id] = s; D.cur = s.id; D.curU = now();
  U.view = "sess"; U.verifyIdx = 0; U.resTab = null; U.seat = "sh"; U.smode = "shingi";
}
function newDebate(s, o){
  const n = Object.keys(s.debates).length + 1;
  const d = { id: rid(), n, title: o.title || "", agenda: o.agenda || null, from: o.from || null, min: o.min || 20, used: 0, e: [] };
  s.debates[d.id] = d; return d;
}
function pickAgenda(s, aid, on){
  const a = D.agendas[aid]; if (!a) return;
  if (on) {
    if (s.picks[aid]) return;
    s.picks[aid] = a.st === "cont" ? 25 : 15;
    const d = newDebate(s, { title: a.x, agenda: aid, min: s.picks[aid] });
    const idx = lastIndex(s, p => p.t === "debate" || p.t === "pick");
    const consultIdx = s.parts.findIndex(p => p.t === "consult" || p.t === "resolve" || p.t === "close");
    const at = idx >= 0 ? idx + 1 : (consultIdx >= 0 ? consultIdx : s.parts.length);
    s.parts.splice(at, 0, mkPart("debate", { d: d.id }));
  } else {
    delete s.picks[aid];
    Object.values(s.debates).filter(d => d.agenda === aid && !d.from).forEach(d => {
      if (d.e.length) return;
      s.parts = s.parts.filter(p => p.d !== d.id); delete s.debates[d.id];
    });
  }
}
function lastIndex(arr, f){ for (let i = arr.parts.length - 1; i >= 0; i--) if (f(arr.parts[i])) return i; return -1; }

/* ───────── 検証の結果 ───────── */
function applyCheck(s, dec, val, note){
  const c = s.checks[dec.id] || (s.checks[dec.id] = { prev: { st: dec.st, checkAt: dec.checkAt }, val: null, note: "", ag: null });
  // いったん元に戻してから当てはめる(押し直しても二重にならない)
  dec.results = (dec.results || []).filter(r => r.sess !== s.id);
  dec.st = c.prev.st; dec.checkAt = c.prev.checkAt; dec.keep = false;
  if (c.ag && D.agendas[c.ag]) { touch(Object.assign(D.agendas[c.ag], { del: true })); c.ag = null; }
  c.val = val; if (note != null) c.note = note;
  if (val) {
    dec.results.push({ sess: s.id, no: s.no, at: today(), v: val, note: c.note });
    const prevOk = dec.results.length >= 2 && dec.results[dec.results.length - 2].v === "効いた";
    if (val === "効いた" && prevOk) dec.st = "ended";
    else if (val === "効いた" || val === "少し効いた") dec.checkAt = addDays(today(), dec.every || 7);
    else {
      dec.st = "cont";
      const old = dec.agenda && D.agendas[dec.agenda];
      const a = { id: rid(), x: old ? old.x : dec.text, at: now(), st: "cont", contN: ((old && old.contN) || 0) + 1, dec: dec.id, why: val, u: now() };
      D.agendas[a.id] = a; c.ag = a.id;
    }
  }
  touch(dec);
}

/* ───────── 議決のまとまり ───────── */
function dn(s, d){ if (!d) return 0; const ids = s.parts.filter(p => p.t === "debate" && s.debates[p.d]).map(p => p.d); const i = ids.indexOf(d.id); return i >= 0 ? i + 1 : d.n; }
function rootOf(s, d){ let x = d, g = 0; while (x.from && s.debates[x.from] && g++ < 30) x = s.debates[x.from]; return x; }
function groups(s){
  const out = [], seen = {};
  s.parts.filter(p => p.t === "debate" && s.debates[p.d]).forEach(p => {
    const d = s.debates[p.d], r = rootOf(s, d), ag = d.agenda || r.agenda;
    const key = ag ? "a:" + ag : "d:" + r.id;
    if (!seen[key]) { seen[key] = { key, agenda: ag, title: ag && D.agendas[ag] ? D.agendas[ag].x : (r.title || "審議" + circ(dn(s, r))), debates: [] }; out.push(seen[key]); }
    seen[key].debates.push(d);
  });
  return out;
}
function ideasOf(s, g){
  const list = [];
  g.debates.forEach(d => d.e.forEach(e => { if (e.k === "say" && e.g === "案") list.push({ id: e.id, x: e.x, by: memberOf(e.m).name + " · 審議" + circ(dn(s, d)) }); }));
  (s.consult.ans || []).forEach(e => { if (e.g === "案") list.push({ id: e.id, x: e.x, by: "Claude(参考人) · 相談" }); });
  return list;
}
const resOf = (s, key) => s.res[key] || (s.res[key] = { picked: [], text: "", edited: false, every: 7, date: "", mode: "rule", how: "", showHow: false, cont: false });

/* ───────── 描画 ───────── */
function render(){
  const app = $("#app"), y = window.scrollY, ae = document.activeElement, aid = ae && ae.id;
  let sel = null; try { if (aid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) {}
  if (U.view === "set") app.innerHTML = viewSettings();
  else if (U.view === "sess" && S()) app.innerHTML = viewSession();
  else { U.view = "home"; app.innerHTML = viewHome(); }
  $("#sheet").innerHTML = U.sheet ? viewSheet() : "";
  const dock = $(".dock"); const sp = $(".spacer"); if (dock && sp) sp.style.setProperty("--sp", (dock.offsetHeight + 12) + "px");
  if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  if (aid) { const n = document.getElementById(aid); if (n && n !== ae && document.activeElement !== n) { n.focus({ preventScroll: true }); if (sel) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  tick(true);
}
function savedLabel(){
  if (!NET.conn) return '<span class="saved">✓ 手元に保存済み</span>';
  if (NET.state === "err") return '<span class="saved err">同期できない・手元に保存済み</span>';
  if (NET.dirty || NET.busy) return '<span class="saved">✓ 保存済み・同期中</span>';
  return '<span class="saved">✓ 保存済み</span>';
}
function stepsBar(s, cls){
  const cp = curPart(s);
  return '<div class="' + (cls || "steps") + '">' + onParts(s).map(p => '<i class="' + (p === cp ? "c" : p.done ? "d" : "") + '" style="--c:' + T[p.t].c + '"></i>').join("") + "</div>";
}
function partName(s, p){ if (p.t === "debate") { const d = s.debates[p.d]; return "審議" + (d ? circ(dn(s, d)) : ""); } return T[p.t].n; }
function partLabel(s, p){ if (p.t === "debate") { const d = s.debates[p.d]; return "審議" + (d ? circ(dn(s, d)) : "") + (d && d.title ? "「" + cut(d.title, 10) + "」" : ""); } return T[p.t].n; }
function nextPart(s){ const on = onParts(s), cp = curPart(s), i = on.indexOf(cp); return on.slice(i + 1).find(p => !p.done) || on[i + 1] || null; }

function buildPrompt(s){

  const L = [];

  L.push(m ? "あなたは議員「" + m.name + "」(" + (m.d || "") + ")の席に座って、この議論に加わってください。発言録の穴と、反対意見を出してください。" : "あなたは中立の参考人として、この議論の穴と、見落としている案を出してください。");
  L.push("");
  groups(s).forEach(g => {

    const a = g.agenda && D.agendas[g.agenda];
    if (a && a.dec && D.decisions[a.dec]) { const dd = D.decisions[a.dec], r = (dd.results || []).slice(-1)[0]; L.push("前回の決定:" + dd.text + (r ? " → " + r.v + (r.note ? "(" + r.note + ")" : "") : "")); }

        if (e.k === "pause") return;
        if (e.k === "shingi") L.push("- (自分のメモ)" + e.x.replace(/\n/g, " / "));
        else if (e.k === "sum") L.push("- (まとめ)" + e.x.replace(/\n/g, " / "));

    });

  });

    case "addag": { const el = b.parentElement.querySelector("input"), x = el && el.value.trim(); if (!x) { el && el.focus(); return; } mut(() => { const na = { id: rid(), x, at: now(), st: "box", u: now() }; D.agendas[na.id] = na; }); const e2 = $("#newag"); if (e2) e2.focus({ preventScroll: true }); return; }

function findEntry(s, id){ if (!s) return null; for (const d of Object.values(s.debates)) { const e = d.e.find(x => x.id === id); if (e) return e; } return s.consult.ans.find(x => x.id === id) || null; }
function onInput(ev){
  const t = ev.target, s = S();
  if (t.id === "comp") { U.drafts[t.dataset.dk] = t.value; saveUI(); return; }

function onKey(ev){

async function copyText(t){

  try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e) { return false; }
}
let toastT = null;
function toast(msg){ let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = "none"; }, 2400); }

/* ───────── 時計 ───────── */
let lastAlive = 0;
function tick(force){
  const s = S(); if (!s) return;
  const tm = $("#tm"); if (tm) tm.textContent = hms(liveElapsed(s));
  const cp = curPart(s), d = cp && cp.d && s.debates[cp.d], dt = $("#dtm");
  if (d && dt) { const left = d.min * 60000 - debUsed(s, d); dt.textContent = "残り " + ms2(left); dt.classList.toggle("w", left < 120000);
    if (!force && left < 180000 && left > 178500 && U.view === "sess") render(); }
  if (s.run && now() - lastAlive > 10000) { lastAlive = now(); alive(); }
}

/* ───────── 同期(notion-daily に 1 つのファイル) ─────────
   手元が正。開いたとき・戻ったときに取りに行って混ぜ、変えたら少し待って送る。
   混ぜ方:議題・決定・会・あとで は id ごとに新しいほう(u)、設定と「いまの会」も新しいほう。 */
function merge(a, b){
  if (!b) return a; if (!a) return b;
  const out = normalize(JSON.parse(JSON.stringify(a)));
  ["agendas", "decisions", "sessions", "later"].forEach(k => { Object.entries(b[k] || {}).forEach(([id, x]) => { const y = out[k][id]; if (!y || (x.u || 0) > (y.u || 0)) out[k][id] = x; }); });
  if ((b.settings && b.settings.u || 0) > (out.settings.u || 0)) out.settings = Object.assign(defaults().settings, b.settings);
  if ((b.curU || 0) > (out.curU || 0)) { out.cur = b.cur; out.curU = b.curU; }
  out.settings.nextNo = Math.max(out.settings.nextNo || 1, (b.settings && b.settings.nextNo) || 1, ...Object.values(out.sessions).filter(s => !s.del).map(s => (s.no || 0) + 1));
  return out;
}
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const api = () => "https://api.github.com/repos/" + encodeURIComponent(NET.conn.owner) + "/" + encodeURIComponent(NET.conn.repo) + "/contents/" + DATA_PATH;
const hdr = x => Object.assign({ "Authorization": "Bearer " + NET.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRemote(){
  const r = await fetch(api() + "?ref=" + encodeURIComponent(NET.conn.branch || "main") + "&t=" + now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) { NET.sha = null; return null; }
  if (!r.ok) throw new Error("読み込み " + r.status);
  const j = await r.json(); NET.sha = j.sha;
  let txt = j.content ? b64d(j.content) : null;
  if (!txt && j.download_url) { const r2 = await fetch(j.download_url, { cache: "no-store" }); txt = await r2.text(); }
  return txt ? JSON.parse(txt) : null;
}
async function pull(){
  if (!NET.conn || !NET.conn.token) return;
  NET.busy = true; updSaved();
  try {
    const remote = await fetchRemote();
    const before = JSON.stringify(D);
    D = merge(D, remote); saveLocal();
    NET.state = "";
    const changed = JSON.stringify(D) !== before;
    if (!remote || JSON.stringify(remote) !== JSON.stringify(D)) NET.dirty = true;
    NET.busy = false;
    if (changed) { checkSudden(); render(); } else updSaved();
    if (NET.dirty) queuePush(300);
  } catch (e) { NET.busy = false; NET.state = "err"; updSaved(); console.warn(e); }
}
function queuePush(ms){ NET.dirty = true; updSaved(); clearTimeout(NET.timer); NET.timer = setTimeout(push, ms == null ? 1500 : ms); }
async function push(){
  if (!NET.conn || !NET.conn.token || !NET.dirty) { updSaved(); return; }
  if (NET.busy) { queuePush(800); return; }
  NET.busy = true;
  try {
    for (let tries = 0; tries < 3; tries++) {
      const body = { message: "最高評議会を更新", content: b64e(JSON.stringify(D)), branch: NET.conn.branch || "main" };
      if (NET.sha) body.sha = NET.sha;
      const r = await fetch(api(), { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
      if (r.ok) { const j = await r.json(); NET.sha = j.content && j.content.sha; NET.dirty = false; NET.state = ""; break; }
      if (r.status === 409 || r.status === 422) { const remote = await fetchRemote(); D = merge(D, remote); saveLocal(); continue; }
      throw new Error("保存 " + r.status);
    }
  } catch (e) { NET.state = "err"; console.warn(e); }
  NET.busy = false; updSaved();
}
function updSaved(){ const el = $(".saved"); if (el) el.outerHTML = savedLabel(); }
function findConn(){
  const mine = lsGet(K_CONN, null); if (mine && mine.token) return mine;
  // ほかのアプリ(同じ nisenonamae.github.io)で入れたトークンを借りる
  const keys = ["sho-conn", "kenseiin-conn"]; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/conn/i.test(k) && !keys.includes(k) && k !== K_CONN) keys.push(k); } } catch (e) {}
  for (const k of keys) { const c = lsGet(k, null); if (c && typeof c === "object" && c.token && c.owner) { const x = { owner: c.owner, repo: "notion-daily", branch: c.branch || "main", token: c.token, from: k.replace(/-conn$/, "") }; if (c.repo === "notion-daily" || !c.repo) { lsSet(K_CONN, x); return x; } } }
  return null;
}

/* ───────── 急に閉じたとき ───────── */
function checkSudden(){
  const s = S(); if (!s || !s.run) return;
  const la = Math.max(+(localStorage.getItem(K_ALIVE) || 0), s.u || 0, s.since);
  if (now() - la < 120000) return;                 // すぐ戻ってきたなら、そのまま続ける
  s.elapsed += Math.max(0, la - s.since); const cp = curPart(s); if (cp && cp.d && s.debates[cp.d]) s.debates[cp.d].used += Math.max(0, la - s.since);
  s.since = la; s.run = false; s.pauses = s.pauses || []; s.pauses.push({ at: la, why: "急に閉じた", when: "", part: s.cur });
  const d = cp && cp.d && s.debates[cp.d]; if (d && d.e.length && d.e[d.e.length - 1].k !== "pause") d.e.push({ id: rid(), k: "pause", at: la });
  touch(s); U.view = "home"; saveLocal(); queuePush();
}

/* ───────── 起動 ───────── */
function boot(){
  if ("serviceWorker" in navigator && !window.__hyTest) navigator.serviceWorker.register("./sw.js").catch(() => {});
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("keydown", onKey);
  document.addEventListener("change", onChange);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { const s = S(); if (s && s.run) { alive(); } if (NET.dirty) push(); } else { checkSudden(); render(); pull(); } });
  window.addEventListener("pagehide", () => { alive(); });
  checkSudden();
  if (U.view === "sess" && !S()) U.view = "home";
  if (S() && !S().run) U.view = "home";
  NET.conn = findConn();
  render();
  setInterval(() => tick(false), 1000);
  if (NET.conn) pull();
}
window.__hy = { get D(){ return D; }, U, merge, parseAnswer, buildPrompt: () => buildPrompt(S()), groups: () => groups(S()), render };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
